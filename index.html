<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사주 만세력 & 운세 풀이 - UI 보존 수정본</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 및 Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- 🌟 lunar-javascript CDN 추가 (우주적 천문 데이터 기반 정확한 만세력) 🌟 -->
  <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.min.js"></script>

  <style>
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.7s ease-out forwards; }
    .text-justify { text-align: justify; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- 명리학 기초 데이터 (음양, 오행) ---
    const stems = ["갑(甲/목)", "을(乙/목)", "병(丙/화)", "정(丁/화)", "무(戊/토)", "기(己/토)", "경(庚/금)", "신(辛/금)", "임(壬/수)", "계(癸/수)"];
    const branches = ["자(子/수)", "축(丑/토)", "인(寅/목)", "묘(卯/목)", "진(辰/토)", "사(巳/화)", "오(午/화)", "미(未/토)", "신(申/금)", "유(酉/금)", "술(戌/토)", "해(亥/수)"];

    const stemInfo = {
      "갑": { el: "목", yy: "+" }, "을": { el: "목", yy: "-" },
      "병": { el: "화", yy: "+" }, "정": { el: "화", yy: "-" },
      "무": { el: "토", yy: "+" }, "기": { el: "토", yy: "-" },
      "경": { el: "금", yy: "+" }, "신": { el: "금", yy: "-" },
      "임": { el: "수", yy: "+" }, "계": { el: "수", yy: "-" }
    };

    const branchInfo = {
      "자": { el: "수", yy: "-" }, "축": { el: "토", yy: "-" },
      "인": { el: "목", yy: "+" }, "묘": { el: "목", yy: "-" },
      "진": { el: "토", yy: "+" }, "사": { el: "화", yy: "+" }, 
      "오": { el: "화", yy: "-" }, "미": { el: "토", yy: "-" },
      "신": { el: "금", yy: "+" }, "유": { el: "금", yy: "-" },
      "술": { el: "토", yy: "+" }, "해": { el: "수", yy: "+" }
    };

    const elementsData = {
      "목": { color: "bg-green-500", icon: "🌲", txtColor: "text-green-900" },
      "화": { color: "bg-red-500", icon: "🔥", txtColor: "text-red-900" },
      "토": { color: "bg-yellow-500", icon: "⛰️", txtColor: "text-yellow-900" },
      "금": { color: "bg-slate-200", icon: "⚙️", txtColor: "text-slate-900" },
      "수": { color: "bg-blue-500", icon: "💧", txtColor: "text-blue-900" }
    };

    // 🌟 지장간 (Hidden Stems) 12지신 완벽 매핑 데이터 🌟
    const hiddenStems = {
      "자": ["임", "계"],
      "축": ["계", "신", "기"],
      "인": ["무", "병", "갑"],
      "묘": ["갑", "을"],
      "진": ["을", "계", "무"],
      "사": ["무", "경", "병"],
      "오": ["병", "기", "정"],
      "미": ["정", "을", "기"],
      "신": ["무", "임", "경"],
      "유": ["경", "신"],
      "술": ["신", "정", "무"],
      "해": ["무", "갑", "임"]
    };

    // 천간 글자를 주면 오행을 찾아주는 헬퍼 함수 (지장간 색칠용)
    const getElementForStemChar = (char) => {
      const stemMatch = stems.find(s => s.startsWith(char));
      if(stemMatch) return stemMatch.split('/')[1]?.replace(')', '');
      return "";
    };

    const elTextColor = {
      "목": "text-green-400", "화": "text-red-400", "토": "text-yellow-400",
      "금": "text-slate-300", "수": "text-blue-400"
    };

    // 🌟 한자 -> 한글 매핑 도구 (lunar-javascript 연동용)
    const h2kStem = { "甲":"갑", "乙":"을", "丙":"병", "丁":"정", "戊":"무", "己":"기", "庚":"경", "辛":"신", "壬":"임", "癸":"계" };
    const h2kBranch = { "子":"자", "丑":"축", "寅":"인", "卯":"묘", "辰":"진", "巳":"사", "午":"오", "未":"미", "申":"신", "酉":"유", "戌":"술", "亥":"해" };

    const getKorPillar = (hanjaStr) => {
      if (!hanjaStr || hanjaStr.length < 2) return { stem: "?(모름/?)", branch: "?(모름/?)" };
      const kS = h2kStem[hanjaStr.charAt(0)];
      const kB = h2kBranch[hanjaStr.charAt(1)];
      return {
        stem: stems.find(s => s.startsWith(kS)) || "?(모름/?)",
        branch: branches.find(b => b.startsWith(kB)) || "?(모름/?)"
      };
    };

    // 🌟 주요 신살(神殺) 계산 로직
    function getShinsal(dayStemChar, branchesArr, stemsArr) {
      const shinsalList = [];
      const bChars = branchesArr.map(b => b.split('(')[0]);
      const sChars = stemsArr.map(s => s.split('(')[0]);

      const yeokmaCount = bChars.filter(b => ["인", "신", "사", "해"].includes(b)).length;
      if (yeokmaCount >= 2) {
        shinsalList.push({ name: "역마살(驛馬殺)", type: "warning", desc: "활동성이 매우 강하고 이동이나 변화가 잦은 기운입니다.", caution: "잦은 이동으로 인한 체력 고갈이나 무계획적인 이직은 피하는 것이 좋습니다." });
      }
      const dohwaCount = bChars.filter(b => ["자", "오", "묘", "유"].includes(b)).length;
      if (dohwaCount >= 2) {
        shinsalList.push({ name: "도화살(桃花殺)", type: "good", desc: "타인의 시선을 끌고 매력을 발산하는 기운이 강합니다.", caution: "구설수나 불필요한 이성 문제에 휘말릴 수 있습니다." });
      }
      const hwagaeCount = bChars.filter(b => ["진", "술", "축", "미"].includes(b)).length;
      if (hwagaeCount >= 2) {
        shinsalList.push({ name: "화개살(華蓋殺)", type: "neutral", desc: "내면이 깊고 철학, 종교, 예술에 대한 이해도가 남다릅니다.", caution: "현실 감각이 무뎌지거나 고집, 우울감을 겪을 수 있습니다." });
      }
      return shinsalList;
    }

    // 🌟 핵심 통계 로직: 십성(육친) 계산 함수
    function getTenGod(dayStemChar, targetChar, isBranch) {
      if (!targetChar || targetChar.includes("?")) return "";
      const dayKey = dayStemChar.split('(')[0];
      const targetKey = targetChar.split('(')[0];
      if (dayKey === targetKey && !isBranch) return "나(日干)";
      const me = stemInfo[dayKey];
      const target = isBranch ? branchInfo[targetKey] : stemInfo[targetKey];
      if (!me || !target) return "";
      const sameYinYang = me.yy === target.yy;

      if (me.el === target.el) return sameYinYang ? "비견" : "겁재";
      if ((me.el === "목" && target.el === "화") || (me.el === "화" && target.el === "토") || (me.el === "토" && target.el === "금") || (me.el === "금" && target.el === "수") || (me.el === "수" && target.el === "목")) return sameYinYang ? "식신" : "상관";
      if ((me.el === "목" && target.el === "토") || (me.el === "화" && target.el === "금") || (me.el === "토" && target.el === "수") || (me.el === "금" && target.el === "목") || (me.el === "수" && target.el === "화")) return sameYinYang ? "편재" : "정재";
      if ((target.el === "목" && me.el === "토") || (target.el === "화" && me.el === "금") || (target.el === "토" && me.el === "수") || (target.el === "금" && me.el === "목") || (target.el === "수" && me.el === "화")) return sameYinYang ? "편관" : "정관";
      if ((target.el === "목" && me.el === "화") || (target.el === "화" && me.el === "토") || (target.el === "토" && me.el === "금") || (target.el === "금" && me.el === "수") || (target.el === "수" && me.el === "목")) return sameYinYang ? "편인" : "정인";
      return "";
    }

    // ===============================
    // 🌟 정밀 명리학 분석 엔진
    // ===============================
    // 기준: 자평명리의 기본 원리(월령, 통근, 투간, 합충형파해, 조후, 격국, 종격)를
    // 앱에서 계산 가능한 규칙형 엔진으로 구현한 것입니다.
    // 학파별 차이가 있으므로 최종 용신은 "단정"이 아니라 후보 랭킹으로 보여줍니다.

    const generates = {
      "목": "화",
      "화": "토",
      "토": "금",
      "금": "수",
      "수": "목"
    };

    const controls = {
      "목": "토",
      "토": "수",
      "수": "화",
      "화": "금",
      "금": "목"
    };

    const getResourceElement = (el) => Object.keys(generates).find(key => generates[key] === el) || "";
    const getControlElement = (el) => Object.keys(controls).find(key => controls[key] === el) || "";

    const getElementTypeForDay = (dayElement, targetElement) => {
      const resource = getResourceElement(dayElement);
      const officer = getControlElement(dayElement);
      const output = generates[dayElement];
      const wealth = controls[dayElement];

      if (targetElement === dayElement) return "비겁";
      if (targetElement === resource) return "인성";
      if (targetElement === output) return "식상";
      if (targetElement === wealth) return "재성";
      if (targetElement === officer) return "관성";
      return "기타";
    };

    const monthElementPower = {
      "인": "목", "묘": "목", "진": "토",
      "사": "화", "오": "화", "미": "토",
      "신": "금", "유": "금", "술": "토",
      "해": "수", "자": "수", "축": "토"
    };

    const seasonDisplay = {
      "인": "초봄 목기", "묘": "한봄 목기", "진": "봄 끝 토기",
      "사": "초여름 화기", "오": "한여름 화기", "미": "여름 끝 토기",
      "신": "초가을 금기", "유": "한가을 금기", "술": "가을 끝 토기",
      "해": "초겨울 수기", "자": "한겨울 수기", "축": "겨울 끝 토기"
    };

    const monthSeason = {
      "인": "spring", "묘": "spring", "진": "lateSpring",
      "사": "summer", "오": "summer", "미": "lateSummer",
      "신": "autumn", "유": "autumn", "술": "lateAutumn",
      "해": "winter", "자": "winter", "축": "lateWinter"
    };

    const seasonKorean = {
      spring: "봄", lateSpring: "봄 끝 환절기",
      summer: "여름", lateSummer: "여름 끝 환절기",
      autumn: "가을", lateAutumn: "가을 끝 환절기",
      winter: "겨울", lateWinter: "겨울 끝 환절기"
    };

    const elementLabel = {
      "목": "목(木)", "화": "화(火)", "토": "토(土)", "금": "금(金)", "수": "수(水)"
    };

    function addStrengthPoint(target, points, reason, details) {
      if (!target) return;
      target.score += points;
      target.details.push({ points, reason, details });
    }

    function calculateStrength(pillars, isTimeUnknown = false) {
      const dayStemChar = pillars.day.stem.split('(')[0];
      const dayElement = stemInfo[dayStemChar]?.el || "";
      const resource = getResourceElement(dayElement);
      const officer = getControlElement(dayElement);
      const output = generates[dayElement];
      const wealth = controls[dayElement];

      const result = {
        score: 0,
        result: "중화",
        grade: "보통",
        dayElement,
        resource,
        output,
        wealth,
        officer,
        monthBranch: pillars.month.branch.split('(')[0],
        seasonElement: "",
        details: []
      };

      const pillarList = [
        { key: "year", label: "년주", data: pillars.year, stemWeight: 3, branchMainWeight: 3, hiddenWeight: 0.45 },
        { key: "month", label: "월주", data: pillars.month, stemWeight: 6, branchMainWeight: 10, hiddenWeight: 0.9 },
        { key: "day", label: "일주", data: pillars.day, stemWeight: 0, branchMainWeight: 5, hiddenWeight: 0.7 },
        { key: "time", label: "시주", data: pillars.time, stemWeight: isTimeUnknown ? 0 : 3, branchMainWeight: isTimeUnknown ? 0 : 3, hiddenWeight: isTimeUnknown ? 0 : 0.45 }
      ];

      const scoreByElementType = (element, baseWeight, sourceLabel) => {
        const type = getElementTypeForDay(dayElement, element);
        if (type === "비겁") addStrengthPoint(result, baseWeight * 1.0, `${sourceLabel}: 비겁(${element})`, "일간과 같은 오행이라 내 힘을 직접 보탭니다.");
        else if (type === "인성") addStrengthPoint(result, baseWeight * 0.85, `${sourceLabel}: 인성(${element})`, "나를 생해주는 오행이라 일간을 돕습니다.");
        else if (type === "식상") addStrengthPoint(result, baseWeight * -0.55, `${sourceLabel}: 식상(${element})`, "내가 생해 밖으로 내보내는 기운이라 일간의 힘을 소모합니다.");
        else if (type === "재성") addStrengthPoint(result, baseWeight * -0.75, `${sourceLabel}: 재성(${element})`, "내가 극하고 관리해야 하는 기운이라 일간의 힘을 사용합니다.");
        else if (type === "관성") addStrengthPoint(result, baseWeight * -0.95, `${sourceLabel}: 관성(${element})`, "나를 극하는 압박과 규칙의 기운이라 일간을 약하게 만듭니다.");
      };

      pillarList.forEach(item => {
        const p = item.data;
        if (!p || !p.stem || p.stem.includes("?")) return;

        const stemChar = p.stem.split('(')[0];
        const stemEl = stemInfo[stemChar]?.el;
        if (item.stemWeight > 0 && stemChar !== dayStemChar) scoreByElementType(stemEl, item.stemWeight, `${item.label} 천간 ${stemChar}`);

        if (!p.branch || p.branch.includes("?")) return;
        const branchChar = p.branch.split('(')[0];
        const branchEl = branchInfo[branchChar]?.el;
        if (item.branchMainWeight > 0) scoreByElementType(branchEl, item.branchMainWeight, `${item.label} 지지 ${branchChar}`);

        const hList = hiddenStems[branchChar] || [];
        hList.forEach((hStem, idx) => {
          const hEl = stemInfo[hStem]?.el;
          const orderWeight = idx === hList.length - 1 ? 1.0 : 0.55;
          scoreByElementType(hEl, item.hiddenWeight * orderWeight, `${item.label} 지장간 ${hStem}`);
        });
      });

      const monthBranch = result.monthBranch;
      const seasonEl = monthElementPower[monthBranch];
      result.seasonElement = seasonEl;

      if (seasonEl === dayElement) addStrengthPoint(result, 18, `월령 득령: ${seasonDisplay[monthBranch]}`, "태어난 달의 계절이 일간과 같아서 뿌리가 강합니다.");
      else if (seasonEl === resource) addStrengthPoint(result, 12, `월령 생조: ${seasonDisplay[monthBranch]}`, "태어난 달의 계절이 일간을 생해주어 힘을 보탭니다.");
      else if (seasonEl === output) addStrengthPoint(result, -8, `월령 설기: ${seasonDisplay[monthBranch]}`, "태어난 달의 계절이 일간의 기운을 밖으로 빼냅니다.");
      else if (seasonEl === wealth) addStrengthPoint(result, -10, `월령 재성: ${seasonDisplay[monthBranch]}`, "태어난 달의 계절이 일간이 감당해야 할 재성 쪽으로 기울어 있습니다.");
      else if (seasonEl === officer) addStrengthPoint(result, -12, `월령 관성: ${seasonDisplay[monthBranch]}`, "태어난 달의 계절이 일간을 제어하는 쪽이라 압박이 강합니다.");

      result.score = Math.round(result.score * 10) / 10;

      if (result.score >= 26) {
        result.result = "신강";
        result.grade = result.score >= 38 ? "매우 강함" : "강한 편";
      } else if (result.score <= -8) {
        result.result = "신약";
        result.grade = result.score <= -20 ? "매우 약함" : "약한 편";
      } else {
        result.result = "중화";
        result.grade = "균형권";
      }
      return result;
    }

    function calculateYongshin(dayElement, strengthData) {
      const resource = getResourceElement(dayElement);
      const output = generates[dayElement];
      const wealth = controls[dayElement];
      const officer = getControlElement(dayElement);

      if (strengthData.result === "신강") {
        return { yongshin: output, heeshin: wealth, gishin: dayElement, gusin: resource, desc: "일간 힘이 강한 편이라 기운을 적절히 빼주거나 현실적으로 쓰게 만드는 식상·재성 계열이 유리합니다." };
      }
      if (strengthData.result === "신약") {
        return { yongshin: resource, heeshin: dayElement, gishin: officer, gusin: wealth, desc: "일간 힘이 약한 편이라 나를 생해주는 인성과 같은 편을 만들어주는 비겁 계열이 유리합니다." };
      }
      return { yongshin: "균형", heeshin: "조화", gishin: "과다 오행", gusin: "치우친 기운", desc: "일간 세력이 중화권이라 특정 오행 하나보다 전체 균형과 과다한 기운 조절이 중요합니다." };
    }

    function getStrengthReading(strengthData, yongshinData) {
      return `[신강/신약 분석 - ${strengthData.result}(${strengthData.grade})]\n일간의 세력 점수는 ${strengthData.score}점입니다. 월지 ${strengthData.monthBranch}(${strengthData.seasonElement})의 계절 기운과 천간·지지·지장간을 함께 보아 판단했습니다.\n\n[용신 구조]\n용신: ${yongshinData.yongshin}\n희신: ${yongshinData.heeshin}\n기신: ${yongshinData.gishin}\n구신: ${yongshinData.gusin}\n\n${yongshinData.desc}\n\n※ 기본 억부 판단입니다. 아래 정밀 명리 엔진에서는 통근, 투간, 조후, 격국, 종격, 합충형파해까지 추가 반영합니다.`;
    }

    function getPillarArray(pillars, isTimeUnknown = false) {
      const list = [
        { key: "year", label: "년주", ...pillars.year },
        { key: "month", label: "월주", ...pillars.month },
        { key: "day", label: "일주", ...pillars.day }
      ];
      if (!isTimeUnknown) list.push({ key: "time", label: "시주", ...pillars.time });
      return list;
    }

    function getStemChar(stemText) {
      return stemText && !stemText.includes("?") ? stemText.split('(')[0] : "";
    }

    function getBranchChar(branchText) {
      return branchText && !branchText.includes("?") ? branchText.split('(')[0] : "";
    }

    function countElementsWithHidden(pillars, isTimeUnknown = false) {
      const counts = { "목": 0, "화": 0, "토": 0, "금": 0, "수": 0 };
      const sources = [];
      const pList = getPillarArray(pillars, isTimeUnknown);

      pList.forEach(p => {
        const s = getStemChar(p.stem);
        if (s && p.key !== "day") {
          const el = stemInfo[s]?.el;
          counts[el] += p.key === "month" ? 1.35 : 1;
          sources.push({ source: `${p.label} 천간 ${s}`, element: el, weight: p.key === "month" ? 1.35 : 1 });
        }

        const b = getBranchChar(p.branch);
        if (b) {
          const bel = branchInfo[b]?.el;
          counts[bel] += p.key === "month" ? 1.65 : 1.1;
          sources.push({ source: `${p.label} 지지 ${b}`, element: bel, weight: p.key === "month" ? 1.65 : 1.1 });

          (hiddenStems[b] || []).forEach((h, idx, arr) => {
            const hel = stemInfo[h]?.el;
            const weight = (idx === arr.length - 1 ? 0.55 : 0.25) * (p.key === "month" ? 1.6 : 1);
            counts[hel] += weight;
            sources.push({ source: `${p.label} 지장간 ${h}`, element: hel, weight });
          });
        }
      });

      Object.keys(counts).forEach(k => counts[k] = Math.round(counts[k] * 10) / 10);
      return { counts, sources };
    }

    function analyzeRoots(dayStemChar, dayElement, pillars, isTimeUnknown = false) {
      const roots = [];
      let rootScore = 0;
      getPillarArray(pillars, isTimeUnknown).forEach(p => {
        const b = getBranchChar(p.branch);
        if (!b) return;
        const hList = hiddenStems[b] || [];
        const exact = hList.includes(dayStemChar);
        const sameEl = hList.filter(h => stemInfo[h]?.el === dayElement);
        const mainRoot = hList[hList.length - 1];
        const isMain = mainRoot === dayStemChar;
        const isMonth = p.key === "month";

        if (exact || sameEl.length > 0) {
          let score = exact ? 7 : 3;
          if (isMain) score += 4;
          if (isMonth) score += 5;
          rootScore += score;
          roots.push({
            pillar: p.label,
            branch: b,
            hidden: hList.join("·"),
            type: exact ? (isMain ? "본기 통근" : "지장간 통근") : "동오행 뿌리",
            score,
            desc: `${p.label} ${b} 속 지장간(${hList.join("·")})에서 ${exact ? dayStemChar : dayElement} 기운을 얻습니다.`
          });
        }
      });
      return { rootScore, roots, hasStrongRoot: roots.some(r => r.type === "본기 통근" || r.score >= 10) };
    }

    function analyzeTugan(pillars, isTimeUnknown = false) {
      const pList = getPillarArray(pillars, isTimeUnknown);
      const topStems = pList.map(p => ({ pillar: p.label, stem: getStemChar(p.stem) })).filter(x => x.stem);
      const revealed = [];

      pList.forEach(p => {

        if (!b) return;
        (hiddenStems[b] || []).forEach(h => {
          const tops = topStems.filter(t => t.stem === h);
          tops.forEach(t => {
            revealed.push({ hiddenPillar: p.label, branch: b, stem: h, topPillar: t.pillar, element: stemInfo[h]?.el, desc: `${p.label} ${b}의 지장간 ${h}가 ${t.pillar} 천간에 드러났습니다.` });
          });
        });
      });

      const unique = [];
      const seen = new Set();
      revealed.forEach(r => {
        const key = `${r.hiddenPillar}-${r.branch}-${r.stem}-${r.topPillar}`;
        if (!seen.has(key)) { seen.add(key); unique.push(r); }
      });
      return unique;
    }

        winter: { need: ["화", "토"], avoid: ["수"], desc: "겨울 신금은 냉하고 습하므로 화로 온기를 얻고 토로 보호해야 합니다." },
        summer: { need: ["수", "토"], avoid: ["화"], desc: "여름 신금은 열에 약하므로 수로 식히고 토로 생조합니다." },
        autumn: { need: ["화", "수"], avoid: ["금"], desc: "가을 신금은 기운이 왕하므로 화로 다듬고 수로 윤택하게 합니다." },
        spring: { need: ["토", "금"], avoid: ["목"], desc: "봄 신금은 목에게 소모되기 쉬워 토금 보강이 유리합니다." }
      },
      "임": {
        winter: { need: ["화", "토"], avoid: ["수", "금"], desc: "겨울 임수는 물이 너무 차고 강해 화로 따뜻하게 하고 토로 제방을 세워야 합니다." },
        summer: { need: ["금", "수"], avoid: ["화", "토"], desc: "여름 임수는 마르기 쉬워 금으로 수원을 만들고 수를 보충합니다." },
        autumn: { need: ["화", "목"], avoid: ["금", "수"], desc: "가을 임수는 금생수가 강해질 수 있어 화목으로 흐름을 조절합니다." },
        spring: { need: ["금", "토"], avoid: ["목"], desc: "봄 임수는 목으로 많이 빠지므로 금으로 보충하고 토로 범람을 막습니다." }
      },
      "계": {
        winter: { need: ["화", "토"], avoid: ["수", "금"], desc: "겨울 계수는 한습이 심해 화로 해동하고 토로 형태를 잡아야 합니다." },
        summer: { need: ["금", "수"], avoid: ["화", "토"], desc: "여름 계수는 증발되기 쉬워 금수 보강이 중요합니다." },
        autumn: { need: ["화", "목"], avoid: ["금", "수"], desc: "가을 계수는 차가워지므로 화로 온기를 더하고 목으로 흐름을 씁니다." },
        spring: { need: ["금", "토"], avoid: ["목"], desc: "봄 계수는 목으로 새기 쉬워 금토가 균형을 잡습니다." }
      }
    };

    function getSeasonGroup(monthBranch) {
      const raw = monthSeason[monthBranch] || "spring";
      if (raw.includes("Spring")) return "spring";
      if (raw.includes("Summer")) return "summer";
      if (raw.includes("Autumn")) return "autumn";
      if (raw.includes("Winter")) return "winter";
      return raw;
    }

    function analyzeJohoo(dayStemChar, monthBranch) {
      const rawSeason = monthSeason[monthBranch] || "spring";
      let group = rawSeason;
      if (rawSeason === "lateSpring") group = "spring";
      if (rawSeason === "lateSummer") group = "summer";
      if (rawSeason === "lateAutumn") group = "autumn";
      if (rawSeason === "lateWinter") group = "winter";

      const rule = johooRules[dayStemChar]?.[group] || { need: [], avoid: [], desc: "조후 규칙을 찾지 못했습니다." };
      return {
        season: seasonKorean[rawSeason] || rawSeason,
        group,
        need: rule.need,
        avoid: rule.avoid,
        desc: rule.desc
      };
    }

    function rankYongshinCandidates({ dayElement, strengthData, johoo, pattern, follow, relations, elementPower }) {
      const candidates = ["목", "화", "토", "금", "수"].map(el => ({ element: el, score: 0, reasons: [] }));
      const add = (el, score, reason) => {
        const c = candidates.find(x => x.element === el);
        if (!c) return;
        c.score += score;
        c.reasons.push(reason);
      };

      const resource = getResourceElement(dayElement);
      const output = generates[dayElement];
      const wealth = controls[dayElement];
      const officer = getControlElement(dayElement);

      if (follow.isFollow) {
        const dominant = Object.entries(elementPower.counts).sort((a,b)=>b[1]-a[1])[0]?.[0];
        add(dominant, 32, "종격 가능성이 있어 가장 강한 세력을 거스르지 않는 방향을 우선 후보로 봅니다.");
      } else if (strengthData.result === "신강") {
        add(output, 24, "신강 사주는 기운을 빼주는 식상이 우선 후보입니다.");
        add(wealth, 18, "강한 일간은 재성을 감당해 현실적 성과로 만들 수 있습니다.");
        add(officer, 10, "관성은 강한 일간을 제어하는 보조 후보입니다.");
        add(dayElement, -20, "이미 강한 비겁은 더하면 과해지기 쉽습니다.");
        add(resource, -16, "인성은 강한 일간을 더 생해 과다를 만들 수 있습니다.");
      } else if (strengthData.result === "신약") {
        add(resource, 24, "신약 사주는 나를 생해주는 인성이 우선 후보입니다.");
        add(dayElement, 18, "같은 편인 비겁은 일간을 직접 보강합니다.");
        add(officer, -22, "관성은 약한 일간을 더 압박할 수 있습니다.");
        add(wealth, -14, "재성은 약한 일간이 감당하기 어렵습니다.");
      } else {
        add(johoo.need[0], 16, "중화권에서는 조후상 가장 필요한 기운을 우선 봅니다.");
        add(johoo.need[1], 10, "조후 보조 기운입니다.");
      }

      johoo.need.forEach((el, idx) => add(el, idx === 0 ? 28 : 18, `조후상 ${elementLabel[el]} 기운이 필요합니다.`));
      johoo.avoid.forEach(el => add(el, -18, `조후상 ${elementLabel[el]} 기운은 과하면 불리합니다.`));

      relations.forEach(r => {
        if (r.result && ["목", "화", "토", "금", "수"].includes(r.result)) {
          add(r.result, r.type.includes("합") ? 5 : 2, `${r.name}으로 ${elementLabel[r.result]} 기운이 형성됩니다.`);
        }
        if (r.type === "충") {
          add(dayElement, -2, `${r.name}으로 원국 안정성이 흔들릴 수 있어 일간 자체만 믿기 어렵습니다.`);
        }
      });

      const sorted = candidates
        .map(c => ({ ...c, score: Math.round(c.score * 10) / 10 }))
        .sort((a, b) => b.score - a.score);

      return sorted;
    }

    function buildAdvancedReading(analysis) {
      const top = analysis.yongshinRanking[0];
      const second = analysis.yongshinRanking[1];
      const third = analysis.yongshinRanking[2];
      return `[정밀 명리 엔진 종합]\n최종 1순위 용신 후보는 ${top?.element || "?"}입니다. 2순위는 ${second?.element || "?"}, 3순위는 ${third?.element || "?"}입니다.\n\n[판단 흐름]\n1) 월령과 통근으로 일간 세력 판단: ${analysis.strength.result}(${analysis.strength.grade}, ${analysis.strength.score}점)\n2) 통근: ${analysis.roots.roots.length ? analysis.roots.roots.map(r => `${r.pillar}${r.branch}:${r.type}`).join(', ') : '뚜렷한 통근 약함'}\n3) 투간: ${analysis.tugan.length ? analysis.tugan.map(t => `${t.stem}(${t.hiddenPillar}→${t.topPillar})`).join(', ') : '뚜렷한 투간 없음'}\n4) 조후: ${analysis.johoo.season} 출생, ${analysis.johoo.desc}\n5) 격국: ${analysis.pattern.pattern} / 신뢰도 ${analysis.pattern.confidence}\n6) 종격: ${analysis.follow.type}\n\n※ 이 엔진은 여러 고전 명리 기준을 규칙화한 계산형 모델입니다. 실제 사람 감정처럼 모든 예외를 절대적으로 단정하지 않고, 후보 랭킹과 근거를 함께 보여주는 방식이 가장 안전합니다.`;
    }

    function analyzeAdvancedMyeongri(pillars, isTimeUnknown = false) {
      const dayStemChar = getStemChar(pillars.day.stem);
      const dayElement = stemInfo[dayStemChar]?.el || "";
      const strength = calculateStrength(pillars, isTimeUnknown);
      const basicYongshin = calculateYongshin(dayElement, strength);
      const monthBranch = getBranchChar(pillars.month.branch);
      const elementPower = countElementsWithHidden(pillars, isTimeUnknown);
      const roots = analyzeRoots(dayStemChar, dayElement, pillars, isTimeUnknown);
      const tugan = analyzeTugan(pillars, isTimeUnknown);
      const relations = analyzeRelations(pillars, isTimeUnknown);
      const johoo = analyzeJohoo(dayStemChar, monthBranch);
      const pattern = analyzePattern(pillars);
      const follow = analyzeFollowStructure(dayElement, strength, roots, elementPower);
      const yongshinRanking = rankYongshinCandidates({ dayElement, strengthData: strength, johoo, pattern, follow, relations, elementPower });

      const analysis = { dayStemChar, dayElement, strength, basicYongshin, elementPower, roots, tugan, relations, johoo, pattern, follow, yongshinRanking };
      analysis.reading = buildAdvancedReading(analysis);
      return analysis;
    }


    // ===============================
    // 🌟 대운 / 연애 시기 계산 엔진
    // ===============================
    // 주의: 실제 대운 시작 시기는 절기 계산 방식, 지역시, 야자시 적용 학파에 따라 조금 달라질 수 있습니다.
    // 여기서는 GitHub Pages에서 안정적으로 돌아가도록 고정 절기표 기반의 근사 계산을 사용합니다.

    const stemChars = ["갑", "을", "병", "정", "무", "기", "경", "신", "임", "계"];
    const branchChars = ["자", "축", "인", "묘", "진", "사", "오", "미", "신", "유", "술", "해"];

    function getPillarIndex(stemChar, branchChar) {
      for (let i = 0; i < 60; i++) {
        if (stemChars[i % 10] === stemChar && branchChars[i % 12] === branchChar) return i;
      }
      return 0;
    }

    function getPillarByIndex(index) {
      const normalized = ((index % 60) + 60) % 60;
      const s = stemChars[normalized % 10];
      const b = branchChars[normalized % 12];
      return {
        stemChar: s,
        branchChar: b,
        stem: stems.find(x => x.startsWith(s)) || s,
        branch: branches.find(x => x.startsWith(b)) || b,
        text: `${s}${b}`
      };
    }

    function getDaewoonDirection(yearStemChar, gender) {
      const yy = stemInfo[yearStemChar]?.yy || "+";
      const isYangYear = yy === "+";
      const isMale = gender === "male";
      // 전통적으로 남양/여음 순행, 남음/여양 역행으로 봅니다.
      const forward = (isMale && isYangYear) || (!isMale && !isYangYear);
      return {
        forward,
        label: forward ? "순행" : "역행",
        desc: forward ? "월주에서 앞으로 진행" : "월주에서 뒤로 진행"
      };
    }

    const solarTermApprox = [
      { name: "소한", month: 1, day: 5 }, { name: "대한", month: 1, day: 20 },
      { name: "입춘", month: 2, day: 4 }, { name: "우수", month: 2, day: 19 },
      { name: "경칩", month: 3, day: 5 }, { name: "춘분", month: 3, day: 20 },
      { name: "청명", month: 4, day: 4 }, { name: "곡우", month: 4, day: 20 },
      { name: "입하", month: 5, day: 5 }, { name: "소만", month: 5, day: 21 },
      { name: "망종", month: 6, day: 5 }, { name: "하지", month: 6, day: 21 },
      { name: "소서", month: 7, day: 7 }, { name: "대서", month: 7, day: 22 },
      { name: "입추", month: 8, day: 7 }, { name: "처서", month: 8, day: 23 },
      { name: "백로", month: 9, day: 7 }, { name: "추분", month: 9, day: 23 },
      { name: "한로", month: 10, day: 8 }, { name: "상강", month: 10, day: 23 },
      { name: "입동", month: 11, day: 7 }, { name: "소설", month: 11, day: 22 },
      { name: "대설", month: 12, day: 7 }, { name: "동지", month: 12, day: 22 }
    ];

    function buildSolarTermDates(year) {
      return solarTermApprox.map(t => ({ ...t, date: new Date(year, t.month - 1, t.day, 12, 0, 0) }));
    }

    function getNearestSolarTermForDaewoon(birthDate, forward) {
      const y = birthDate.getFullYear();
      const all = [...buildSolarTermDates(y - 1), ...buildSolarTermDates(y), ...buildSolarTermDates(y + 1)]
        .sort((a, b) => a.date - b.date);
      const target = forward
        ? all.find(t => t.date > birthDate)
        : [...all].reverse().find(t => t.date < birthDate);
      return target || all[0];
    }

    function calculateStartAgeByTerm(birthDate, forward) {
      const term = getNearestSolarTermForDaewoon(birthDate, forward);
      const diffMs = Math.abs(term.date.getTime() - birthDate.getTime());
      const diffDays = diffMs / (1000 * 60 * 60 * 24);
      // 3일 = 1년, 1일 = 4개월 기준 근사
      const totalMonths = Math.max(1, Math.round(diffDays * 4));
      const years = Math.floor(totalMonths / 12);
      const months = totalMonths % 12;
      return {
        termName: term.name,
        termDate: `${term.date.getFullYear()}-${String(term.date.getMonth() + 1).padStart(2, '0')}-${String(term.date.getDate()).padStart(2, '0')}`,
        diffDays: Math.round(diffDays * 10) / 10,
        startAge: Math.max(1, Math.round(totalMonths / 12)),
        startYears: years,
        startMonths: months
      };
    }

    function getAnnualPillar(year) {
      try {
        // 입춘 이후 기준으로 안정적인 연주를 얻기 위해 해당 연도 7월 1일을 사용합니다.
        const solar = window.Solar.fromDate(new Date(year, 6, 1, 12, 0));
        const bazi = solar.getLunar().getEightChar();
        return getKorPillar(bazi.getYear());
      } catch (e) {
        // 라이브러리 실패 시 1984 갑자를 기준으로 보정합니다.
        const idx = year - 1984;
        const p = getPillarByIndex(idx);
        return { stem: p.stem, branch: p.branch };
      }
    }

    function scorePillarForTheme(dayElement, pillar, themeElement, yongshinRanking = []) {
      const stemChar = getStemChar(pillar.stem);
      const branchChar = getBranchChar(pillar.branch);
      const stemEl = stemInfo[stemChar]?.el;
      const branchEl = branchInfo[branchChar]?.el;
      const hidden = hiddenStems[branchChar] || [];
      let score = 0;
      const reasons = [];

      if (stemEl === themeElement) { score += 18; reasons.push(`천간 ${stemChar}가 핵심 기운`); }
      if (branchEl === themeElement) { score += 14; reasons.push(`지지 ${branchChar}가 핵심 기운`); }
      hidden.forEach(h => {
        if (stemInfo[h]?.el === themeElement) { score += 5; reasons.push(`지장간 ${h}에 핵심 기운 숨음`); }
      });

      const topYong = yongshinRanking[0]?.element;
      const secondYong = yongshinRanking[1]?.element;
      if (stemEl === topYong || branchEl === topYong) { score += 8; reasons.push(`용신 ${topYong} 보강`); }
      if (stemEl === secondYong || branchEl === secondYong) { score += 4; reasons.push(`희신 후보 ${secondYong} 보조`); }

      const output = generates[dayElement];
      if (themeElement === output && (stemEl === output || branchEl === output)) {
        score += 4;
        reasons.push("표현력과 만남의 계기가 늘어나는 흐름");
      }

      return { score, reasons };
    }

    function calculateDaewoon(pillars, form, birthDate, advancedAnalysis) {
      const yearStemChar = getStemChar(pillars.year.stem);
      const monthStemChar = getStemChar(pillars.month.stem);
      const monthBranchChar = getBranchChar(pillars.month.branch);
      const direction = getDaewoonDirection(yearStemChar, form.gender);
      const start = calculateStartAgeByTerm(birthDate, direction.forward);
      const monthIndex = getPillarIndex(monthStemChar, monthBranchChar);
      const step = direction.forward ? 1 : -1;
      const startYear = birthDate.getFullYear() + start.startAge;
      const topYong = advancedAnalysis.yongshinRanking[0]?.element;
      const secondYong = advancedAnalysis.yongshinRanking[1]?.element;

      const periods = Array.from({ length: 9 }).map((_, i) => {
        const p = getPillarByIndex(monthIndex + step * (i + 1));
        const fromAge = start.startAge + i * 10;
        const toAge = fromAge + 9;
        const fromYear = startYear + i * 10;
        const toYear = fromYear + 9;
        const stemEl = stemInfo[p.stemChar]?.el;
        const branchEl = branchInfo[p.branchChar]?.el;
        const tenStem = getTenGod(pillars.day.stem, p.stem, false);
        const tenBranch = getTenGod(pillars.day.stem, p.branch, true);
        let score = 50;
        const tags = [];

        [stemEl, branchEl].forEach(el => {
          if (el === topYong) { score += 18; tags.push(`용신 ${el}`); }
          else if (el === secondYong) { score += 10; tags.push(`희신 ${el}`); }
          else if (el === advancedAnalysis.basicYongshin.gishin) { score -= 12; tags.push(`기신 ${el}`); }
        });

        if ((tenStem || "").includes("재") || (tenBranch || "").includes("재")) tags.push("재물/현실운");
        if ((tenStem || "").includes("관") || (tenBranch || "").includes("관")) tags.push("직장/명예운");
        if ((tenStem || "").includes("식") || (tenStem || "").includes("상") || (tenBranch || "").includes("식") || (tenBranch || "").includes("상")) tags.push("표현/성과운");
        if ((tenStem || "").includes("인") || (tenBranch || "").includes("인")) tags.push("공부/문서운");

        let level = "보통";
        if (score >= 70) level = "좋은 흐름";
        else if (score <= 38) level = "조심할 흐름";

        return {
          index: i + 1,
          pillar: p.text,
          stem: p.stem,
          branch: p.branch,
          fromAge,
          toAge,
          fromYear,
          toYear,
          tenStem,
          tenBranch,
          score: Math.max(0, Math.min(100, score)),
          level,
          tags: [...new Set(tags)].slice(0, 4)
        };
      });

      return {
        direction,
        start,
        periods,
        desc: `${direction.label} 대운이며, 약 ${start.startAge}세 전후부터 첫 대운이 시작되는 것으로 계산했습니다.`
      };
    }

    function getLoveThemeElement(dayElement, gender) {
      if (gender === "female") {
        return {
          element: getControlElement(dayElement),
          label: "관성",
          desc: "여성 사주에서는 전통적으로 관성을 배우자·연애 인연의 핵심 별로 봅니다."
        };
      }
      return {
        element: controls[dayElement],
        label: "재성",
        desc: "남성 사주에서는 전통적으로 재성을 배우자·연애 인연의 핵심 별로 봅니다."
      };
    }

    function calculateLoveTiming(pillars, form, birthDate, advancedAnalysis, daewoonData) {
      const dayElement = advancedAnalysis.dayElement;
      const loveTheme = getLoveThemeElement(dayElement, form.gender);
      const dayBranch = getBranchChar(pillars.day.branch);
      const peachBranches = ["자", "오", "묘", "유"];
      const currentYear = new Date().getFullYear();
      const years = [];

      for (let y = currentYear; y <= currentYear + 15; y++) {
        const annual = getAnnualPillar(y);
        const annualStem = getStemChar(annual.stem);
        const annualBranch = getBranchChar(annual.branch);
        const base = scorePillarForTheme(dayElement, annual, loveTheme.element, advancedAnalysis.yongshinRanking);
        let score = base.score;
        const reasons = [...base.reasons];

        const tenStem = getTenGod(pillars.day.stem, annual.stem, false);
        const tenBranch = getTenGod(pillars.day.stem, annual.branch, true);
        if ((tenStem || "").includes(loveTheme.label[0]) || (tenBranch || "").includes(loveTheme.label[0])) {
          score += 10;
          reasons.push(`${loveTheme.label} 십성이 드러남`);
        }
        if (peachBranches.includes(annualBranch)) {
          score += 7;
          reasons.push("도화 지지로 만남·호감도 상승");
        }
        if (dayBranch && annualBranch && dayBranch !== annualBranch) {
          const rel = branch六合.find(c => hasPair([dayBranch, annualBranch], c.pair[0], c.pair[1]));
          if (rel) { score += 8; reasons.push(`일지와 ${rel.name} 형성`); }
        }
        const clash = branchClashes.find(c => hasPair([dayBranch, annualBranch], c.pair[0], c.pair[1]));
        if (clash) {
          score += 4;
          reasons.push(`일지와 ${clash.name}으로 관계 변화수`);
        }

        const activeDaewoon = daewoonData.periods.find(p => y >= p.fromYear && y <= p.toYear);
        if (activeDaewoon) {
          if (activeDaewoon.tags.some(t => t.includes("재물") || t.includes("직장") || t.includes("표현"))) {
            score += 3;
            reasons.push(`${activeDaewoon.pillar} 대운 영향`);
          }
          const dStemEl = stemInfo[getStemChar(activeDaewoon.stem)]?.el;
          const dBranchEl = branchInfo[getBranchChar(activeDaewoon.branch)]?.el;
          if (dStemEl === loveTheme.element || dBranchEl === loveTheme.element) {
            score += 10;
            reasons.push(`대운에서 ${loveTheme.label} 기운 보조`);
          }
        }

        let level = "잔잔한 인연운";
        if (score >= 44) level = "강한 연애 시기";
        else if (score >= 30) level = "인연이 들어오기 쉬운 시기";
        else if (score <= 12) level = "연애보다 자기정비 시기";

        years.push({
          year: y,
          age: y - birthDate.getFullYear() + 1,
          pillar: `${annualStem}${annualBranch}`,
          score: Math.round(score),
          level,
          reasons: [...new Set(reasons)].slice(0, 4)
        });
      }

      const topYears = [...years].sort((a, b) => b.score - a.score).slice(0, 5);
      return {
        theme: loveTheme,
        years,
        topYears,
        summary: `${loveTheme.label}(${loveTheme.element}) 기운과 도화·일지 작용을 함께 보아 앞으로 15년 중 인연운이 강한 해를 뽑았습니다.`
      };
    }

    function App() {

      // 기존 코드의 -30분 지역시 보정은 제거했습니다. 출생 시간이 KST로 입력되었다면 그대로 계산합니다.
      const getSajuData = (form) => {
        const year = parseInt(form.date.substring(0, 4), 10);
        const month = parseInt(form.date.substring(4, 6), 10);
        const day = parseInt(form.date.substring(6, 8), 10);

        let hour = 12; // 시간 모를 경우 정오 기준. 시주는 모름으로 표시합니다.
        let minute = 0;
        if (!form.isTimeUnknown) {
          hour = parseInt(form.time.substring(0, 2), 10);
          minute = parseInt(form.time.substring(2, 4), 10);
        }

        if (!window.Solar || !window.Lunar) {
          throw new Error('lunar-javascript 라이브러리가 로드되지 않았습니다. 인터넷 연결 또는 CDN 주소를 확인해주세요.');
        }

        const exactDate = new Date(year, month - 1, day, hour, minute, 0);
        const solar = window.Solar.fromYmdHms(year, month, day, hour, minute, 0);
        const lunar = solar.getLunar();
        const bazi = lunar.getEightChar();

        const yPillar = getKorPillar(bazi.getYear());
        const mPillar = getKorPillar(bazi.getMonth());

                  </div>
                  <div className="flex flex-col md:flex-row gap-6 items-center">
                    <div className="flex-shrink-0 bg-slate-900/50 p-4 rounded-xl border border-amber-600/30 text-center w-full md:w-32">
                      <p className="text-xs text-slate-400 mb-1">오늘의 기운</p>
                      <div className="text-2xl font-bold text-white">{result.today.stem.split('(')[0]} {result.today.branch.split('(')[0]}</div>
                    </div>
                    <p className="text-slate-200 leading-relaxed text-lg text-justify flex-1">
                      {result.today.fortune}
                    </p>
                  </div>
                </div>

                {/* ✨ 신살 영역 ✨ */}
                {result.data.shinsal && result.data.shinsal.length > 0 && (
                  <div className="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-rose-900/50">
                    <h3 className="text-xl font-bold text-rose-400 mb-6 flex items-center gap-2"><span>🔮</span> 타고난 신살(神殺)과 주의점</h3>
                    <div className="space-y-4">
                      {result.data.shinsal.map((s, idx) => (
                        <div key={idx} className="bg-slate-700/30 p-5 rounded-xl border border-slate-600/50">
                          <span className="px-3 py-1 text-sm font-bold rounded-md bg-rose-500/20 text-rose-300 border border-rose-500/30 mb-3 inline-block">{s.name}</span>
                          <p className="text-slate-200 leading-relaxed mb-3">{s.desc}</p>
                          {readingMode === 'harsh' && (
                            <div className="bg-rose-950/40 p-4 rounded-lg border-l-4 border-rose-500 fade-in">
                              <p className="text-sm text-rose-200"><strong>⚠️ 팩폭 경고:</strong> {s.caution}</p>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="space-y-6">
                  <div className="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700">
                    <h3 className="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2"><span>✨</span> 성향과 직업</h3>
                    <p className="text-slate-300 leading-loose text-lg whitespace-pre-wrap text-justify">{result.readings.general[readingMode]}</p>
                  </div>
                  <div className="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700">
                    <h3 className="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2"><span>💰</span> 금전운과 재산 관리법</h3>
                    <p className="text-slate-300 leading-loose text-lg whitespace-pre-wrap text-justify">{result.readings.wealth[readingMode]}</p>
                  </div>
                  <div className="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700">
                    <h3 className="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2"><span>💖</span> 연애운과 인연의 흐름</h3>
                    <p className="text-slate-300 leading-loose text-lg whitespace-pre-wrap text-justify">{result.readings.love[readingMode]}</p>
                  </div>
                  
                  {/* ✨ 지장간 특별 분석 영역 추가 ✨ */}
                  <div className="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-purple-900/50">
                    <h3 className="text-xl font-bold text-purple-400 mb-4 flex items-center gap-2"><span>🕵️</span> 지장간 심층 분석 (숨겨진 재물과 본성)</h3>
                    <p className="text-slate-300 leading-loose text-lg whitespace-pre-wrap text-justify">{result.readings.hidden[readingMode]}</p>
                  </div>
                </div>

              </div>
            )}

            {result && result.type === 'couple' && (
              <div className="space-y-8 fade-in text-center p-10 bg-slate-800 rounded-2xl border border-slate-700">
                <h2 className="text-3xl text-pink-400 font-bold mb-4">💕 궁합 결과</h2>
                <div className="text-7xl font-black text-white mb-6">{result.score}점</div>
                <p className="text-xl text-slate-300 leading-relaxed">{result.readings.overall[readingMode]}</p>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
