<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사주 만세력 & 운세 풀이</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 및 Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.7s ease-out forwards; }
    .text-justify { text-align: justify; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- 명리학 기초 데이터 (음양, 오행) ---
    const stems = ["갑(甲/목)", "을(乙/목)", "병(丙/화)", "정(丁/화)", "무(戊/토)", "기(己/토)", "경(庚/금)", "신(辛/금)", "임(壬/수)", "계(癸/수)"];
    const branches = ["자(子/수)", "축(丑/토)", "인(寅/목)", "묘(卯/목)", "진(辰/토)", "사(巳/화)", "오(午/화)", "미(未/토)", "신(申/금)", "유(酉/금)", "술(戌/토)", "해(亥/수)"];

    const stemInfo = {
      "갑": { el: "목", yy: "+" }, "을": { el: "목", yy: "-" },
      "병": { el: "화", yy: "+" }, "정": { el: "화", yy: "-" },
      "무": { el: "토", yy: "+" }, "기": { el: "토", yy: "-" },
      "경": { el: "금", yy: "+" }, "신": { el: "금", yy: "-" },
      "임": { el: "수", yy: "+" }, "계": { el: "수", yy: "-" }
    };

    // 지지 정기(본기) 기준 음양오행
    const branchInfo = {
      "자": { el: "수", yy: "-" }, "축": { el: "토", yy: "-" },
      "인": { el: "목", yy: "+" }, "묘": { el: "목", yy: "-" },
      "진": { el: "토", yy: "+" }, "사": { el: "화", yy: "+" }, 
      "오": { el: "화", yy: "-" }, "미": { el: "토", yy: "-" },
      "신": { el: "금", yy: "+" }, "유": { el: "금", yy: "-" },
      "술": { el: "토", yy: "+" }, "해": { el: "수", yy: "+" }
    };

    const elementsData = {
      "목": { color: "bg-green-500", icon: "🌲" },
      "화": { color: "bg-red-500", icon: "🔥" },
      "토": { color: "bg-yellow-600", icon: "⛰️" },
      "금": { color: "bg-slate-300", icon: "⚙️" },
      "수": { color: "bg-blue-500", icon: "💧" }
    };

    // 🌟 주요 신살(神殺) 계산 로직
    function getShinsal(dayStemChar, branchesArr, stemsArr) {
      const shinsalList = [];
      const bChars = branchesArr.map(b => b.split('(')[0]);
      const sChars = stemsArr.map(s => s.split('(')[0]);

      // 1. 역마살
      const yeokmaCount = bChars.filter(b => ["인", "신", "사", "해"].includes(b)).length;
      if (yeokmaCount >= 2) {
        shinsalList.push({
          name: "역마살(驛馬殺)", type: "warning",
          desc: "활동성이 매우 강하고 이동이나 변화가 잦은 기운입니다. 한 곳에 정착하기보다는 돌아다니거나 해외와 연관된 일이 잘 맞습니다.",
          caution: "잦은 이동으로 인한 체력 고갈이나 한 가지 일에 끈기가 부족해질 수 있으니, 무계획적인 이직이나 이사는 피하는 것이 좋습니다."
        });
      }

      // 2. 도화살
      const dohwaCount = bChars.filter(b => ["자", "오", "묘", "유"].includes(b)).length;
      if (dohwaCount >= 2) {
        shinsalList.push({
          name: "도화살(桃花殺)", type: "good",
          desc: "타인의 시선을 끌고 매력을 발산하는 기운이 강합니다. 예술, 방송, 연예, 영업 등 사람을 상대하는 일에서 두각을 나타냅니다.",
          caution: "구설수나 불필요한 이성 문제에 휘말릴 수 있습니다. 넘치는 매력을 건전한 취미나 직업적 성취로 승화시키는 것이 중요합니다."
        });
      }

      // 3. 화개살
      const hwagaeCount = bChars.filter(b => ["진", "술", "축", "미"].includes(b)).length;
      if (hwagaeCount >= 2) {
        shinsalList.push({
          name: "화개살(華蓋殺)", type: "neutral",
          desc: "내면이 깊고 학문, 종교, 예술, 철학에 대한 이해도가 남다릅니다. 고독을 즐기며 정신적인 세계를 추구하는 성향이 강합니다.",
          caution: "현실 감각이 무뎌지거나 지나친 고집, 자기만의 세계에 빠져 우울감을 겪을 수 있으니, 현실과의 균형을 맞추는 연습이 필요합니다."
        });
      }

      // 4. 백호대살
      const baekhoCombos = ["갑진", "을미", "병술", "정축", "무진", "임술", "계축"];
      let hasBaekho = false;
      for (let i = 0; i < sChars.length; i++) {
        if (sChars[i] && bChars[i] && baekhoCombos.includes(sChars[i] + bChars[i])) {
          hasBaekho = true; break;
        }
      }
      if (hasBaekho) {
        shinsalList.push({
          name: "백호대살(白虎大殺)", type: "warning",
          desc: "목표를 향해 돌진하는 폭발적인 에너지와 강한 추진력을 가졌습니다. 큰 뜻을 품으면 남들이 해내기 어려운 일도 성취해 냅니다.",
          caution: "기운이 너무 강해 감정 조절이 어렵거나 타인과 심하게 충돌할 수 있습니다. 욱하는 성질을 다스리고, 특히 혈압이나 사고(건강)에 주의해야 합니다."
        });
      }

      // 5. 괴강살
      const gwaegangCombos = ["무술", "경진", "경술", "임진"];
      let hasGwaegang = false;
      for (let i = 0; i < sChars.length; i++) {
        if (sChars[i] && bChars[i] && gwaegangCombos.includes(sChars[i] + bChars[i])) {
          hasGwaegang = true; break;
        }
      }
      if (hasGwaegang) {
        shinsalList.push({
          name: "괴강살(魁罡殺)", type: "neutral",
          desc: "주관이 매우 뚜렷하고 카리스마와 리더십이 뛰어납니다. 무리에서 우두머리가 되려는 기질이 강하며 극난을 이겨내는 힘이 있습니다.",
          caution: "지나친 독선이나 강압적인 태도로 인해 대인관계가 끊어질 수 있습니다. 유연함과 타협하는 자세를 기르는 것이 평생의 숙제입니다."
        });
      }

      return shinsalList;
    }

    // 🌟 핵심 통계 로직: 십성(육친) 계산 함수
    function getTenGod(dayStemChar, targetChar, isBranch) {
      if (!targetChar || targetChar.includes("?")) return "";
      
      const dayKey = dayStemChar.split('(')[0];
      const targetKey = targetChar.split('(')[0];
      
      if (dayKey === targetKey && !isBranch) return "나(日干)";

      const me = stemInfo[dayKey];
      const target = isBranch ? branchInfo[targetKey] : stemInfo[targetKey];
      
      if (!me || !target) return "";

      const sameYinYang = me.yy === target.yy;

      // 1. 비겁
      if (me.el === target.el) return sameYinYang ? "비견" : "겁재";
      
      // 2. 식상
      if (
        (me.el === "목" && target.el === "화") || (me.el === "화" && target.el === "토") ||
        (me.el === "토" && target.el === "금") || (me.el === "금" && target.el === "수") ||
        (me.el === "수" && target.el === "목")
      ) return sameYinYang ? "식신" : "상관";

      // 3. 재성
      if (
        (me.el === "목" && target.el === "토") || (me.el === "화" && target.el === "금") ||
        (me.el === "토" && target.el === "수") || (me.el === "금" && target.el === "목") ||
        (me.el === "수" && target.el === "화")
      ) return sameYinYang ? "편재" : "정재";

      // 4. 관성
      if (
        (target.el === "목" && me.el === "토") || (target.el === "화" && me.el === "금") ||
        (target.el === "토" && me.el === "수") || (target.el === "금" && me.el === "목") ||
        (target.el === "수" && me.el === "화")
      ) return sameYinYang ? "편관" : "정관";

      // 5. 인성
      if (
        (target.el === "목" && me.el === "화") || (target.el === "화" && me.el === "토") ||
        (target.el === "토" && me.el === "금") || (target.el === "금" && me.el === "수") ||
        (target.el === "수" && me.el === "목")
      ) return sameYinYang ? "편인" : "정인";

      return "";
    }

    function App() {
      // 모드 선택: 'single' (개인 운세), 'couple' (궁합)
      const [viewMode, setViewMode] = useState('single');

      const [form1, setForm1] = useState({ date: '', time: '', gender: 'female', isTimeUnknown: false });
      const [form2, setForm2] = useState({ date: '', time: '', gender: 'male', isTimeUnknown: false });
      
      const [result, setResult] = useState(null);
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const handleForm1Change = (e) => {
        const { name, value, type, checked } = e.target;
        const val = type === 'checkbox' ? checked : (name === 'date' || name === 'time' ? value.replace(/[^0-9]/g, '') : value);
        setForm1({ ...form1, [name]: val });
        setErrorMsg('');
      };

      const handleForm2Change = (e) => {
        const { name, value, type, checked } = e.target;
        const val = type === 'checkbox' ? checked : (name === 'date' || name === 'time' ? value.replace(/[^0-9]/g, '') : value);
        setForm2({ ...form2, [name]: val });
        setErrorMsg('');
      };

      const getSajuData = (form) => {
        const year = parseInt(form.date.substring(0, 4));
        const month = parseInt(form.date.substring(4, 6)) - 1; 
        const day = parseInt(form.date.substring(6, 8));
        
        const utcAnchor = Date.UTC(2024, 0, 1);
        const utcTarget = Date.UTC(year, month, day);
        const diffDays = Math.floor((utcTarget - utcAnchor) / (1000 * 60 * 60 * 24));
        const daySexagenary = ((diffDays % 60) + 60) % 60; 
        
        const dayStemIndex = daySexagenary % 10;
        const dayBranchIndex = daySexagenary % 12;

        const termDays = [6, 4, 6, 5, 6, 6, 7, 8, 8, 8, 8, 7];
        let isPastTerm = day >= termDays[month];
        let sajuYear = month === 0 ? (year - 1) : (month === 1 && !isPastTerm ? year - 1 : year);
        let sajuMonth = month === 0 ? (isPastTerm ? 11 : 10) : (month === 1 ? (isPastTerm ? 0 : 11) : (isPastTerm ? month - 1 : month - 2));

        const yearSexagenary = ((sajuYear - 1984) % 60 + 60) % 60;
        const yearStemIndex = yearSexagenary % 10;
        const yearBranchIndex = yearSexagenary % 12;

        const monthBranchIndex = (sajuMonth + 2) % 12;
        const monthStemIndex = (yearStemIndex * 2 + 2 + sajuMonth) % 10;

        let sajuTimeStem, sajuTimeBranch;
        if (form.isTimeUnknown) {
          sajuTimeStem = "?(모름/?)";
          sajuTimeBranch = "?(모름/?)";
        } else {
          const hour = parseInt(form.time.substring(0, 2));
          const minute = parseInt(form.time.substring(2, 4));
          const shiftedMins = (hour * 60 + minute + 30) % 1440; 
          const timeBranchIndex = Math.floor(shiftedMins / 120) % 12;
          const timeStemIndex = (dayStemIndex * 2 + timeBranchIndex) % 10;
          sajuTimeStem = stems[timeStemIndex];
          sajuTimeBranch = branches[timeBranchIndex];
        }

        const dayStem = stems[dayStemIndex];
        
        const pillars = {
          year: { stem: stems[yearStemIndex], branch: branches[yearBranchIndex], 
                  s_ten: getTenGod(dayStem, stems[yearStemIndex], false), b_ten: getTenGod(dayStem, branches[yearBranchIndex], true) },
          month: { stem: stems[monthStemIndex], branch: branches[monthBranchIndex],
                   s_ten: getTenGod(dayStem, stems[monthStemIndex], false), b_ten: getTenGod(dayStem, branches[monthBranchIndex], true) },
          day: { stem: dayStem, branch: branches[dayBranchIndex],
                 s_ten: "일간(나)", b_ten: getTenGod(dayStem, branches[dayBranchIndex], true) },
          time: { stem: sajuTimeStem, branch: sajuTimeBranch,
                  s_ten: getTenGod(dayStem, sajuTimeStem, false), b_ten: getTenGod(dayStem, sajuTimeBranch, true) }
        };

        const stemsArr = [pillars.year.stem, pillars.month.stem, pillars.day.stem];
        const branchesArr = [pillars.year.branch, pillars.month.branch, pillars.day.branch];
        if (!form.isTimeUnknown) {
          stemsArr.push(pillars.time.stem);
          branchesArr.push(pillars.time.branch);
        }
        
        // 신살 추가 로직
        const shinsal = getShinsal(dayStem, branchesArr, stemsArr);

        const elementsCount = { "목": 0, "화": 0, "토": 0, "금": 0, "수": 0 };
        const tenGodsCount = { "비견":0, "겁재":0, "식신":0, "상관":0, "편재":0, "정재":0, "편관":0, "정관":0, "편인":0, "정인":0 };
        
        const allChars = [pillars.year.stem, pillars.year.branch, pillars.month.stem, pillars.month.branch, pillars.day.stem, pillars.day.branch];
        if (!form.isTimeUnknown) allChars.push(pillars.time.stem, pillars.time.branch);
        
        allChars.forEach(char => {
          if(!char.includes('?')) {
            const el = char.split('/')[1].replace(')', '');
            if (elementsCount[el] !== undefined) elementsCount[el]++;
          }
        });

        [pillars.year, pillars.month, pillars.day, pillars.time].forEach(p => {
          if (tenGodsCount[p.s_ten] !== undefined) tenGodsCount[p.s_ten]++;
          if (tenGodsCount[p.b_ten] !== undefined) tenGodsCount[p.b_ten]++;
        });

        const myElement = dayStem.split('/')[1].replace(')', '');
        return { pillars, elementsCount, tenGodsCount, myElement, totalChars: form.isTimeUnknown ? 6 : 8, allChars, shinsal };
      };

      const calculateRealSaju = (e) => {
        e.preventDefault();
        
        if (form1.date.length !== 8) return setErrorMsg('본인의 생년월일 8자리를 정확히 입력해주세요. (예: 19900515)');
        if (!form1.isTimeUnknown && form1.time.length !== 4) return setErrorMsg('본인의 태어난 시간 4자리를 정확히 입력해주세요. (예: 1430)');
        if (!form1.isTimeUnknown && (parseInt(form1.time.substring(0, 2)) > 23 || parseInt(form1.time.substring(2, 4)) > 59)) return setErrorMsg('올바른 시간을 입력해주세요. (0000 ~ 2359)');

        if (viewMode === 'couple') {
          if (form2.date.length !== 8) return setErrorMsg('상대방의 생년월일 8자리를 정확히 입력해주세요.');
          if (!form2.isTimeUnknown && form2.time.length !== 4) return setErrorMsg('상대방의 태어난 시간 4자리를 정확히 입력해주세요.');
          if (!form2.isTimeUnknown && (parseInt(form2.time.substring(0, 2)) > 23 || parseInt(form2.time.substring(2, 4)) > 59)) return setErrorMsg('상대방의 올바른 시간을 입력해주세요.');
        }

        setLoading(true);
        setResult(null);

        setTimeout(() => {
          const data1 = getSajuData(form1);

          if (viewMode === 'single') {
            const tg = data1.tenGodsCount;
            
            let generalText = `당신의 일간(고유의 본성)은 '${data1.myElement}'의 기운을 띠고 있습니다. \n\n`;
            if (tg['비견'] + tg['겁재'] >= 3) generalText += "통계적으로 '비견/겁재'가 강하여, 주관이 매우 뚜렷하고 승부욕이 강합니다. 남의 밑에 있기보다는 독립적이거나 프리랜서, 사업에 어울리는 강인한 자아를 가졌습니다. 타인과의 타협을 배우는 것이 과제입니다.\n";
            else if (tg['식신'] + tg['상관'] >= 3) generalText += "통계적으로 '식신/상관'이 발달하여, 표현력과 창의력이 아주 뛰어납니다. 언변이 좋고 손재주가 뛰어나 예술, 방송, 교육, 서비스업에서 재능을 크게 발휘합니다. 다재다능하지만 끈기를 기르는 것이 중요합니다.\n";
            else if (tg['편관'] + tg['정관'] >= 3) generalText += "통계적으로 '정관/편관'이 강하게 자리 잡아, 명예와 체면, 규칙을 아주 중요하게 생각합니다. 책임감이 막중하여 조직 생활, 공직, 대기업 등에서 인정받으며 반듯한 리더십을 보여줍니다. 스트레스 관리에 주의해야 합니다.\n";
            else if (tg['편인'] + tg['정인'] >= 3) generalText += "통계적으로 '정인/편인'의 에너지가 많아, 생각의 깊이가 남다르고 학문, 자격증, 연구 분야에 탁월합니다. 직관력이 좋고 문서운(부동산 등)이 강하며, 타인의 마음을 읽어내는 능력이 우수합니다.\n";
            else generalText += "전반적으로 십성의 에너지가 고르게 분포되어 있어, 어떤 환경에 놓여도 원만하게 적응하는 조화로운 성품을 지녔습니다. 성격이 둥글고 대인관계가 무난하여 큰 굴곡 없는 평온한 흐름을 탑니다.\n";

            let wealthText = "";
            const wealthSum = tg['편재'] + tg['정재'];
            const sikSangSum = tg['식신'] + tg['상관'];
            
            if (wealthSum >= 2 && sikSangSum >= 1) wealthText = `사주에 재물(재성)과 그것을 만들어내는 재능(식상)이 함께 있어 '식상생재'의 훌륭한 구조를 띠고 있습니다. 자신의 기술이나 아이디어를 통해 사업적으로 큰 부를 축적할 수 있는 금전운 통계 상위 10%의 사주입니다.\n다만 돈의 스케일이 큰 만큼 지출도 크니 자산 관리에 신경 쓰세요.`;
            else if (wealthSum >= 2) wealthText = `재물(재성)의 기운이 발달하여 돈에 대한 감각과 경제 관념이 뛰어납니다. 특히 '정재'가 강하면 월급이나 안전 자산, '편재'가 강하면 투자나 사업 자산에 인연이 깊습니다. 성실히 모으거나 타이밍을 노려 부를 쌓는 현실적인 금전운입니다.`;
            else if (tg['편인'] + tg['정인'] >= 2) wealthText = `직접적인 현금(재성)보다는 문서(인성)를 통해 부를 축적하는 사주입니다. 현금을 쥐고 있으면 흩어지기 쉬우니, 부동산, 주식, 저작권, 자격증 등 가치가 떨어지지 않는 '문서' 형태로 묶어두는 외적인 가치 보존이 핵심입니다.`;
            else wealthText = `사주 통계상 재물에 대한 집착이 적고 명예나 안정을 더 중시하는 '무재' 혹은 재성이 약한 구조입니다. 돈을 좇기보다는 본인의 실력과 전문성을 키우면 돈이 자연스럽게 따라오는 구조이므로, 젊은 시절의 자기 계발이 평생의 부를 결정합니다.`;

            let loveText = "";
            if (form1.gender === 'female') {
               const gwanSum = tg['편관'] + tg['정관'];
               if (gwanSum >= 2) loveText = `여성의 사주에서 남자를 뜻하는 관성(정관/편관)이 잘 자리 잡고 있습니다. 주변에 본인을 호위하거나 지켜주려는 이성들이 많으며, 반듯하고 책임감 있는 배우자를 만나 안정적인 가정을 꾸릴 확률이 통계적으로 매우 높습니다.`;
               else if (gwanSum === 0) loveText = `관성(남자)의 얽매임보다는 본인의 커리어와 자유를 더 중요시하는 독립적인 성향입니다. 일찍 결혼하기보다는 충분히 자신의 삶을 즐긴 후, 가치관이 통하는 친구 같은 사람과 늦게 만나는 '만혼'이 유리합니다.`;
               else loveText = `자연스럽고 편안한 인연이 적절한 시기에 찾아오는 무난한 연애운입니다. 너무 화려한 만남보다는 일상이나 직장 내에서 자연스럽게 스며드는 인연을 소중히 여기세요.`;
            } else {
               const jaeSum = tg['편재'] + tg['정재'];
               if (jaeSum >= 2) loveText = `남성의 사주에서 여자를 뜻하는 재성(정재/편재)이 풍부합니다. 이성을 대하는 매너가 좋고 센스가 있어 인기가 많습니다. 다양한 만남의 기회가 주어지나, 한 사람에게 진득하게 정착하는 안목을 기르는 것이 평탄한 결혼 생활의 핵심입니다.`;
               else if (jaeSum === 0) loveText = `연애 스킬이나 이벤트보다는 진정성과 묵직함으로 승부하는 타입입니다. 연애에 다소 서툴거나 무심해 보일 수 있으나, 한 번 인연을 맺으면 변함없이 상대를 지키려는 책임감이 매우 강합니다.`;
               else loveText = `자연스럽고 편안한 인연이 적절한 시기에 찾아오는 무난한 연애운입니다. 너무 화려한 만남보다는 일상이나 직장 내에서 자연스럽게 스며드는 인연을 소중히 여기세요.`;
            }

            let weakElements = Object.keys(data1.elementsCount).filter(e => data1.elementsCount[e] === 0);
            if (weakElements.length === 0) {
              const minCount = Math.min(...Object.values(data1.elementsCount));
              weakElements = Object.keys(data1.elementsCount).filter(e => data1.elementsCount[e] === minCount);
            }
            const healthTips = {
              "목": "간과 담낭, 피로 회복 능력이 약할 수 있습니다. 잦은 음주를 피하고 충분한 수면을 취하세요.",
              "화": "심장, 소장, 혈액순환 계통 관리에 신경 쓰세요. 걷기 등 유산소 운동이 필수입니다.",
              "토": "위장 등 소화기관이 예민합니다. 스트레스성 폭식을 피하고 규칙적인 식습관을 가져야 합니다.",
              "금": "폐, 대장, 호흡기가 다소 약한 편입니다. 환절기 감기에 취약하니 호흡기 관리에 유의하세요.",
              "수": "신장, 방광, 생식기 쪽 에너지가 고갈되기 쉽습니다. 수분을 충분히 섭취하고 스트레스를 줄이세요."
            };
            const healthText = `통계적으로 '${weakElements.join(', ')}'의 기운이 가장 억눌려 있습니다.\n해당 장부의 밸런스가 무너지기 쉬우니 주의하세요. ${weakElements.map(e => healthTips[e]).join(' ')}`;

            const now = new Date();
            const todayUtc = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
            const todayDiff = Math.floor((todayUtc - Date.UTC(2024, 0, 1)) / (1000 * 60 * 60 * 24));
            const todaySexagenary = ((todayDiff % 60) + 60) % 60; 
            const todayStem = stems[todaySexagenary % 10];
            const todayBranch = branches[todaySexagenary % 12];
            
            const todayTenGod = getTenGod(data1.pillars.day.stem, todayStem, false);
            let todayFortune = "";
            
            if (todayTenGod.includes('비견') || todayTenGod.includes('겁재')) todayFortune = "내 기운과 같은 '비겁'의 날입니다. 주관이 뚜렷해지고 에너지가 넘치지만, 고집이나 지출이 발생할 수 있으니 주변 사람들과 타협하는 여유를 가지세요.";
            else if (todayTenGod.includes('식신') || todayTenGod.includes('상관')) todayFortune = "표현력과 재능을 상징하는 '식상'의 날입니다. 말솜씨가 좋아지고 활동 범위가 넓어집니다. 막혔던 일이 아이디어로 풀리는 기분 좋은 하루가 될 수 있습니다.";
            else if (todayTenGod.includes('편재') || todayTenGod.includes('정재')) todayFortune = "결과물과 금전을 상징하는 '재성'의 날입니다. 노력에 대한 보상을 얻거나 소소한 금전적 이득, 혹은 반가운 사람(남성 기준 이성)을 만날 확률이 높습니다.";
            else if (todayTenGod.includes('편관') || todayTenGod.includes('정관')) todayFortune = "책임과 명예를 뜻하는 '관성'의 날입니다. 처리해야 할 일이나 직장의 압박이 있을 수 있지만, 묵묵히 해내면 신용이 쌓이고 인정받게 됩니다.";
            else if (todayTenGod.includes('편인') || todayTenGod.includes('정인')) todayFortune = "생각과 문서를 상징하는 '인성'의 날입니다. 새로운 것을 배우거나 자격증, 문서 계약, 혹은 윗사람의 도움을 받기에 아주 좋은 평온한 하루입니다.";
            else todayFortune = "평온하고 무난한 흐름이 이어지는 하루입니다. 일상에 감사하며 내실을 다지세요.";

            const currentYear = now.getFullYear();
            const luckTiming = { wealth: [], love: [], career: [] };
            
            const myDayBranch = data1.pillars.day.branch.split('(')[0];
            const branchCombs = {
              "자": ["축", "신", "진"], "축": ["자", "사", "유"], "인": ["해", "오", "술"],
              "묘": ["술", "해", "미"], "진": ["유", "신", "자"], "사": ["신", "유", "축"],
              "오": ["미", "인", "술"], "미": ["오", "해", "묘"], "신": ["사", "자", "진"],
              "유": ["진", "사", "축"], "술": ["묘", "인", "오"], "해": ["인", "묘", "미"]
            };

            for (let i = 0; i <= 12; i++) {
              const targetY = currentYear + i;
              const ySexagenary = ((targetY - 1984) % 60 + 60) % 60; 
              const yStem = stems[ySexagenary % 10];
              const yBranch = branches[ySexagenary % 12];
              const yBranchChar = yBranch.split('(')[0];
              
              const yTenGodStem = getTenGod(data1.pillars.day.stem, yStem, false);
              
              if (yTenGodStem.includes('재') || yTenGodStem.includes('식') || yTenGodStem.includes('상관')) {
                if(luckTiming.wealth.length < 3) luckTiming.wealth.push(targetY);
              }
              if (yTenGodStem.includes('관') || yTenGodStem.includes('인')) {
                if(luckTiming.career.length < 3) luckTiming.career.push(targetY);
              }
              if (branchCombs[myDayBranch]?.includes(yBranchChar)) {
                if(luckTiming.love.length < 3) luckTiming.love.push(targetY);
              }
            }

            setResult({
              type: 'single', data: data1, timing: luckTiming,
              today: { date: `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일`, stem: todayStem, branch: todayBranch, fortune: todayFortune },
              readings: { general: generalText, wealth: wealthText, love: loveText, health: healthText }
            });

          } else {
            const data2 = getSajuData(form2);
            let score = 50;
            
            let relationText = "";
            const el1 = data1.myElement;
            const el2 = data2.myElement;
            const elementCycles = {
              "목": { generates: "화", limits: "토" }, "화": { generates: "토", limits: "금" },
              "토": { generates: "금", limits: "수" }, "금": { generates: "수", limits: "목" },
              "수": { generates: "목", limits: "화" }
            };
            
            if (elementCycles[el1].generates === el2) {
              score += 20; relationText = `본인(${el1})이 상대방(${el2})을 생(生)해주는 관계입니다. 내가 상대방에게 헌신하고 무언가를 베풀 때 기쁨을 느끼며, 안정감을 주는 상생의 궁합입니다.`;
            } else if (elementCycles[el2].generates === el1) {
              score += 20; relationText = `상대방(${el2})이 본인(${el1})을 생(生)해주는 관계입니다. 상대방으로부터 큰 정신적 위안을 얻으며, 나를 빛나게 만들어주는 상생의 궁합입니다.`;
            } else if (el1 === el2) {
              score += 10; relationText = `두 사람 모두 같은 오행(${el1})을 가졌습니다. 거울을 보는 것처럼 서로를 잘 이해하는 친구 같은 관계입니다. 고집 충돌을 주의해야 합니다.`;
            } else {
              score -= 5; relationText = `서로의 기운이 극(剋)하며 통제하려는 성향이 있습니다. 처음에는 본인에게 없는 강한 매력에 끌리지만, 가치관 차이로 부딪힐 수 있으니 양보가 필요한 관계입니다.`;
            }

            let complementText = "";
            let missing1 = Object.keys(data1.elementsCount).filter(e => data1.elementsCount[e] === 0);
            let missing2 = Object.keys(data2.elementsCount).filter(e => data2.elementsCount[e] === 0);
            let filledBy2 = missing1.filter(e => data2.elementsCount[e] >= 2);
            let filledBy1 = missing2.filter(e => data1.elementsCount[e] >= 2);

            if (filledBy2.length > 0 || filledBy1.length > 0) {
               score += 25; complementText = `매우 훌륭한 오행 보완 구조입니다! 본인에게 부족한 기운을 상대방이 넉넉히 채워주거나, 상대방의 약점을 본인이 보완해 줍니다. 현실적인 문제나 위기가 닥쳤을 때 서로 의지하며 이겨낼 수 있는 천생연분의 요소가 다분합니다.`;
            } else {
               score += 5; complementText = `두 사람의 오행 구성이 서로 비슷하거나 특별히 부족한 부분을 메워주지는 않는 평범한 구조입니다. 서로의 장점을 공유하지만 치명적인 단점도 겹칠 수 있으므로 일상에서 서로의 약점을 의식적으로 배려해야 합니다.`;
            }

            if (score > 100) score = 100;
            if (score < 40) score = Math.floor(Math.random() * 15) + 40; 

            let overallText = "";
            if (score >= 85) overallText = "두 분의 인연은 하늘이 맺어준 것처럼 깊고 아름답습니다. 서로에게 큰 힘이 되어주는 최고의 궁합입니다.";
            else if (score >= 70) overallText = "서로 다름을 인정하고 조금만 양보한다면 오랫동안 좋은 관계를 유지할 수 있는 긍정적인 궁합입니다.";
            else overallText = "가치관의 차이나 성향의 충돌이 있을 수 있습니다. 사랑과 배려로 차이를 극복하려는 노력이 필요합니다.";

            setResult({
              type: 'couple', data1: data1, data2: data2, score: score,
              readings: { relation: relationText, complement: complementText, overall: overallText }
            });
          }

          setLoading(false);
        }, 1500); 
      };

      return (
        <div className="min-h-screen p-4 md:p-8 font-sans bg-slate-900 text-slate-100">
          <div className="max-w-4xl mx-auto space-y-8">
            
            <div className="text-center space-y-3">
              <div className="inline-flex items-center justify-center p-3 bg-amber-500/20 rounded-full mb-4 text-3xl">✨</div>
              <h1 className="text-3xl md:text-4xl font-bold text-amber-400">사주 만세력 & 종합 운세</h1>
              <p className="text-slate-400">명리학 십성(육친) 통계 기반 정통 풀이. 숫자만 입력하세요.</p>
            </div>

            <div className="flex bg-slate-800 p-1 rounded-xl w-full max-w-sm mx-auto shadow-lg border border-slate-700">
              <button 
                onClick={() => { setViewMode('single'); setResult(null); }}
                className={`flex-1 py-3 text-sm font-bold rounded-lg transition-all ${viewMode === 'single' ? 'bg-amber-500 text-slate-900 shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                👤 개인 운세
              </button>
              <button 
                onClick={() => { setViewMode('couple'); setResult(null); }}
                className={`flex-1 py-3 text-sm font-bold rounded-lg transition-all ${viewMode === 'couple' ? 'bg-amber-500 text-slate-900 shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                💕 궁합 보기
              </button>
            </div>

            <div className="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700 relative">
              {errorMsg && (
                <div className="mb-6 p-4 bg-red-500/10 border border-red-500/50 rounded-lg flex items-center gap-3 text-red-400 fade-in">
                  <span>⚠️</span><p>{errorMsg}</p>
                </div>
              )}

              <form onSubmit={calculateRealSaju} className="space-y-8">
                <div>
                  {viewMode === 'couple' && <h3 className="text-lg font-bold text-amber-400 mb-4 border-b border-slate-700 pb-2">👤 본인 정보</h3>}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="space-y-2">
                      <label className="text-sm font-medium text-slate-300 flex items-center gap-2"><span>📅</span> 생년월일 (양력 8자리)</label>
                      <input type="text" name="date" maxLength="8" placeholder="예: 19900515" value={form1.date} onChange={handleForm1Change} className="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all" />
                    </div>
                    <div className="space-y-2">
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-sm font-medium text-slate-300 flex items-center gap-2"><span>⏰</span> 태어난 시간 (4자리)</label>
                        <label className="flex items-center gap-1 cursor-pointer">
                          <input type="checkbox" name="isTimeUnknown" checked={form1.isTimeUnknown} onChange={handleForm1Change} className="w-4 h-4 rounded text-amber-500 bg-slate-700 border-slate-600" />
                          <span className="text-xs text-slate-400">모름</span>
                        </label>
                      </div>
                      <input type="text" name="time" maxLength="4" placeholder="예: 1430" value={form1.time} onChange={handleForm1Change} disabled={form1.isTimeUnknown} className={`w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all ${form1.isTimeUnknown ? 'opacity-40 cursor-not-allowed' : ''}`} />
                    </div>
                    <div className="space-y-2">
                      <label className="text-sm font-medium text-slate-300 flex items-center gap-2"><span>🧑</span> 성별</label>
                      <select name="gender" value={form1.gender} onChange={handleForm1Change} className="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all">
                        <option value="female">여성</option><option value="male">남성</option>
                      </select>
                    </div>
                  </div>
                </div>

                {viewMode === 'couple' && (
                  <div className="fade-in">
                    <h3 className="text-lg font-bold text-pink-400 mb-4 border-b border-slate-700 pb-2">💕 상대방 정보</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      <div className="space-y-2">
                        <label className="text-sm font-medium text-slate-300 flex items-center gap-2"><span>📅</span> 생년월일 (양력 8자리)</label>
                        <input type="text" name="date" maxLength="8" placeholder="예: 19920820" value={form2.date} onChange={handleForm2Change} className="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-pink-500 transition-all" />
                      </div>
                      <div className="space-y-2">
                        <div className="flex items-center justify-between mb-1">
                          <label className="text-sm font-medium text-slate-300 flex items-center gap-2"><span>⏰</span> 태어난 시간 (4자리)</label>
                          <label className="flex items-center gap-1 cursor-pointer">
                            <input type="checkbox" name="isTimeUnknown" checked={form2.isTimeUnknown} onChange={handleForm2Change} className="w-4 h-4 rounded text-pink-500 bg-slate-700 border-slate-600" />
                            <span className="text-xs text-slate-400">모름</span>
                          </label>
                        </div>
                        <input type="text" name="time" maxLength="4" placeholder="예: 0910" value={form2.time} onChange={handleForm2Change} disabled={form2.isTimeUnknown} className={`w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-pink-500 transition-all ${form2.isTimeUnknown ? 'opacity-40 cursor-not-allowed' : ''}`} />
                      </div>
                      <div className="space-y-2">
                        <label className="text-sm font-medium text-slate-300 flex items-center gap-2"><span>🧑</span> 성별</label>
                        <select name="gender" value={form2.gender} onChange={handleForm2Change} className="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-pink-500 transition-all">
                          <option value="male">남성</option><option value="female">여성</option>
                        </select>
                      </div>
                    </div>
                  </div>
                )}
                
                <button type="submit" disabled={loading} className="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all flex justify-center items-center gap-2 mt-4">
                  {loading ? <div className="w-6 h-6 border-4 border-white/30 border-t-white rounded-full animate-spin"></div> : <>{viewMode === 'single' ? '정밀 통계로 명운 분석하기 ✨' : '궁합 결과 확인하기 💕'}</>}
                </button>
              </form>
            </div>

            {result && result.type === 'single' && (
              <div className="space-y-8 fade-in">
                
                <div className="bg-gradient-to-r from-amber-900/50 to-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-amber-700/50">
                  <div className="flex items-center justify-between border-b border-amber-700/30 pb-4 mb-4">
                    <h2 className="text-2xl font-bold text-amber-400 flex items-center gap-2"><span>🌅</span> 오늘의 일진 및 운세</h2>
                    <span className="text-sm bg-amber-500/20 text-amber-300 py-1 px-3 rounded-full">{result.today.date}</span>
                  </div>
                  <div className="flex flex-col md:flex-row gap-6 items-center">
                    <div className="flex-shrink-0 bg-slate-900/50 p-4 rounded-xl border border-amber-600/30 text-center w-full md:w-32">
                      <p className="text-xs text-slate-400 mb-1">오늘의 기운</p>
                      <div className="text-2xl font-bold text-white">{result.today.stem.split('(')[0]} {result.today.branch.split('(')[0]}</div>
                    </div>
                    <p className="text-slate-200 leading-relaxed text-lg text-justify flex-1">
                      {result.today.fortune}
                    </p>
                  </div>
                </div>

                <div className="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700">
                  <h3 className="text-xl font-bold text-amber-400 mb-6 flex items-center gap-2"><span>⏳</span> 특정 운이 들어오는 시기 (향후 12년 명리학 세운 기준)</h3>
                  
                  <div className="space-y-4">
                    <div className="flex flex-col md:flex-row md:items-center bg-slate-700/40 p-5 rounded-xl border border-slate-600/50">
                      <div className="w-full md:w-1/4 font-bold text-yellow-400 flex items-center gap-2 mb-2 md:mb-0 text-lg"><span>💰</span> 금전운 상승 시기</div>
                      <div className="flex-1 text-slate-100 font-semibold text-lg">
                        {result.timing.wealth.length > 0 ? result.timing.wealth.map(y => `${y}년`).join(', ') : "큰 변동성보다는 저축과 안정 유지가 필요한 시기입니다."}
                      </div>
                      <p className="text-sm text-slate-400 mt-2 md:mt-0 w-full md:w-1/3 md:text-right">투자(식상) 및 자산 증식(재성)의 적기</p>
                    </div>

                    <div className="flex flex-col md:flex-row md:items-center bg-slate-700/40 p-5 rounded-xl border border-slate-600/50">
                      <div className="w-full md:w-1/4 font-bold text-pink-400 flex items-center gap-2 mb-2 md:mb-0 text-lg"><span>💖</span> 연애/결혼운 시기</div>
                      <div className="flex-1 text-slate-100 font-semibold text-lg">
                        {result.timing.love.length > 0 ? result.timing.love.map(y => `${y}년`).join(', ') : "나의 내실을 다지고 능력을 키우는 데 집중할 시기입니다."}
                      </div>
                      <p className="text-sm text-slate-400 mt-2 md:mt-0 w-full md:w-1/3 md:text-right">배우자궁이 움직이거나 이성운(합)이 강한 시기</p>
                    </div>

                    <div className="flex flex-col md:flex-row md:items-center bg-slate-700/40 p-5 rounded-xl border border-slate-600/50">
                      <div className="w-full md:w-1/4 font-bold text-blue-400 flex items-center gap-2 mb-2 md:mb-0 text-lg"><span>🏢</span> 직장/합격운 시기</div>
                      <div className="flex-1 text-slate-100 font-semibold text-lg">
                        {result.timing.career.length > 0 ? result.timing.career.map(y => `${y}년`).join(', ') : "현재의 자리를 묵묵히 지키고 실력을 키울 시기입니다."}
                      </div>
                      <p className="text-sm text-slate-400 mt-2 md:mt-0 w-full md:w-1/3 md:text-right">취업(관성), 문서/합격(인성) 상승의 적기</p>
                    </div>
                  </div>
                </div>

                <div className="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
                  <h2 className="text-xl font-bold text-amber-400 mb-6 flex items-center gap-2"><span>🧭</span> 나의 사주 팔자 (만세력 + 십성)</h2>
                  <div className="grid grid-cols-4 gap-2 text-center md:gap-4">
                    <div className="bg-slate-700 p-2 rounded-t-lg font-medium text-slate-300 text-xs md:text-base">시주(시간)</div>
                    <div className="bg-amber-900/40 p-2 rounded-t-lg font-bold text-amber-300 text-xs md:text-base">일주(나)</div>
                    <div className="bg-slate-700 p-2 rounded-t-lg font-medium text-slate-300 text-xs md:text-base">월주(부모)</div>
                    <div className="bg-slate-700 p-2 rounded-t-lg font-medium text-slate-300 text-xs md:text-base">년주(조상)</div>
                    
                    <div className={`bg-slate-700/50 py-4 rounded-lg flex flex-col items-center justify-center border border-slate-600 h-24 ${form1.isTimeUnknown ? 'opacity-50' : ''}`}>
                      <span className="text-[10px] text-emerald-400 mb-1">{result.data.pillars.time.s_ten}</span>
                      <span className="text-2xl md:text-3xl font-bold">{result.data.pillars.time.stem.split('(')[0]}</span>
                      <span className="text-[10px] md:text-xs text-slate-400 mt-1">{result.data.pillars.time.stem.split('(')[1].replace(')', '')}</span>
                    </div>
                    <div className="bg-amber-900/30 py-4 rounded-lg flex flex-col items-center justify-center border border-amber-600/50 h-24">
                      <span className="text-[10px] text-amber-400 mb-1 font-bold">일간(기준)</span>
                      <span className="text-2xl md:text-3xl font-bold text-amber-300">{result.data.pillars.day.stem.split('(')[0]}</span>
                      <span className="text-[10px] md:text-xs text-amber-500/80 mt-1">{result.data.pillars.day.stem.split('(')[1].replace(')', '')}</span>
                    </div>
                    <div className="bg-slate-700/50 py-4 rounded-lg flex flex-col items-center justify-center border border-slate-600 h-24">
                      <span className="text-[10px] text-emerald-400 mb-1">{result.data.pillars.month.s_ten}</span>
                      <span className="text-2xl md:text-3xl font-bold">{result.data.pillars.month.stem.split('(')[0]}</span>
                      <span className="text-[10px] md:text-xs text-slate-400 mt-1">{result.data.pillars.month.stem.split('(')[1].replace(')', '')}</span>
                    </div>
                    <div className="bg-slate-700/50 py-4 rounded-lg flex flex-col items-center justify-center border border-slate-600 h-24">
                      <span className="text-[10px] text-emerald-400 mb-1">{result.data.pillars.year.s_ten}</span>
                      <span className="text-2xl md:text-3xl font-bold">{result.data.pillars.year.stem.split('(')[0]}</span>
                      <span className="text-[10px] md:text-xs text-slate-400 mt-1">{result.data.pillars.year.stem.split('(')[1].replace(')', '')}</span>
                    </div>

                    <div className={`bg-slate-700/50 py-4 rounded-b-lg flex flex-col items-center justify-center border border-slate-600 h-24 ${form1.isTimeUnknown ? 'opacity-50' : ''}`}>
                      <span className="text-[10px] text-sky-400 mb-1">{result.data.pillars.time.b_ten}</span>
                      <span className="text-2xl md:text-3xl font-bold">{result.data.pillars.time.branch.split('(')[0]}</span>
                      <span className="text-[10px] md:text-xs text-slate-400 mt-1">{result.data.pillars.time.branch.split('(')[1].replace(')', '')}</span>
                    </div>
                    <div className="bg-amber-900/30 py-4 rounded-b-lg flex flex-col items-center justify-center border border-amber-600/50 h-24">
                      <span className="text-[10px] text-pink-400 mb-1 font-bold">{result.data.pillars.day.b_ten} (배우자궁)</span>
                      <span className="text-2xl md:text-3xl font-bold text-amber-300">{result.data.pillars.day.branch.split('(')[0]}</span>
                      <span className="text-[10px] md:text-xs text-amber-500/80 mt-1">{result.data.pillars.day.branch.split('(')[1].replace(')', '')}</span>
                    </div>
                    <div className="bg-slate-700/50 py-4 rounded-b-lg flex flex-col items-center justify-center border border-slate-600 h-24">
                      <span className="text-[10px] text-sky-400 mb-1">{result.data.pillars.month.b_ten}</span>
                      <span className="text-2xl md:text-3xl font-bold">{result.data.pillars.month.branch.split('(')[0]}</span>
                      <span className="text-[10px] md:text-xs text-slate-400 mt-1">{result.data.pillars.month.branch.split('(')[1].replace(')', '')}</span>
                    </div>
                    <div className="bg-slate-700/50 py-4 rounded-b-lg flex flex-col items-center justify-center border border-slate-600 h-24">
                      <span className="text-[10px] text-sky-400 mb-1">{result.data.pillars.year.b_ten}</span>
                      <span className="text-2xl md:text-3xl font-bold">{result.data.pillars.year.branch.split('(')[0]}</span>
                      <span className="text-[10px] md:text-xs text-slate-400 mt-1">{result.data.pillars.year.branch.split('(')[1].replace(')', '')}</span>
                    </div>
                  </div>
                  <p className="text-xs text-slate-500 mt-4 text-center">* 위 글자 위에 적힌 글씨(비견, 편재 등)가 바로 사주의 핵심 통계 지표인 '십성(육친)'입니다.</p>
                </div>

                {/* ✨ 추가된 신살 영역 ✨ */}
                {result.data.shinsal && result.data.shinsal.length > 0 && (
                  <div className="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-rose-900/50">
                    <h3 className="text-xl font-bold text-rose-400 mb-6 flex items-center gap-2"><span>🔮</span> 타고난 신살(神殺)과 주의점</h3>
                    <div className="space-y-6">
                      {result.data.shinsal.map((s, idx) => (
                        <div key={idx} className="bg-slate-700/30 p-5 rounded-xl border border-slate-600/50">
                          <div className="flex items-center gap-3 mb-3">
                            <span className={`px-3 py-1 text-sm font-bold rounded-md ${
                              s.type === 'warning' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 
                              s.type === 'good' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 
                              'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30'
                            }`}>
                              {s.name}
                            </span>
                          </div>
                          <p className="text-slate-200 leading-relaxed mb-3">{s.desc}</p>
                          <div className="bg-rose-950/40 p-4 rounded-lg border-l-4 border-rose-500">
                            <p className="text-sm text-rose-200 flex items-start gap-2">
                              <span className="mt-0.5">⚠️</span> 
                              <span><strong>조심해야 할 것:</strong> {s.caution}</span>
                            </p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="space-y-6">
                  <div className="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700">
                    <h3 className="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2"><span>✨</span> 십성 통계 기반: 타고난 성향과 직업</h3>
                    <p className="text-slate-300 leading-loose text-lg whitespace-pre-wrap text-justify">{result.readings.general}</p>
                  </div>
                  <div className="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700">
                    <h3 className="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2"><span>💰</span> 십성 통계 기반: 금전운과 재산 관리법</h3>
                    <p className="text-slate-300 leading-loose text-lg whitespace-pre-wrap text-justify">{result.readings.wealth}</p>
                  </div>
                  <div className="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700">
                    <h3 className="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2"><span>💖</span> 십성 통계 기반: 연애운과 인연의 흐름</h3>
                    <p className="text-slate-300 leading-loose text-lg whitespace-pre-wrap text-justify">{result.readings.love}</p>
                  </div>
                  <div className="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700">
                    <h3 className="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2"><span>💪</span> 오행 통계 기반: 건강 및 체질 관리</h3>
                    <p className="text-slate-300 leading-loose text-lg whitespace-pre-wrap text-justify">{result.readings.health}</p>
                  </div>
                </div>

              </div>
            )}

            {result && result.type === 'couple' && (
              <div className="space-y-8 fade-in">
                
                <div className="bg-gradient-to-r from-pink-900/40 to-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-pink-700/50 text-center">
                  <h2 className="text-2xl font-bold text-pink-400 mb-2">명리학 궁합 종합 점수</h2>
                  <div className="text-6xl md:text-7xl font-black text-white my-6 drop-shadow-lg">{result.score}<span className="text-3xl text-pink-300 ml-2">점</span></div>
                  <p className="text-lg md:text-xl text-slate-200 leading-relaxed max-w-2xl mx-auto">{result.readings.overall}</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
                    <h3 className="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2"><span>☯️</span> 일간(본성) 조화 궁합</h3>
                    <p className="text-slate-300 leading-loose text-justify">{result.readings.relation}</p>
                  </div>
                  <div className="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
                    <h3 className="text-xl font-bold text-blue-400 mb-4 flex items-center gap-2"><span>🧩</span> 오행 보완 궁합</h3>
                    <p className="text-slate-300 leading-loose text-justify">{result.readings.complement}</p>
                  </div>
                </div>

                <div className="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700">
                  <h3 className="text-xl font-bold text-pink-400 mb-6 flex items-center gap-2"><span>📊</span> 두 사람의 기운(오행) 비교</h3>
                  <div className="space-y-6">
                    {Object.keys(elementsData).map(el => (
                      <div key={el} className="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
                        <div className="w-16 flex items-center gap-2 text-slate-300 font-medium"><span>{elementsData[el].icon}</span> {el}</div>
                        
                        <div className="flex-1 flex flex-col gap-1">
                          <div className="flex items-center gap-2">
                            <span className="text-xs text-slate-500 w-10 text-right">본인</span>
                            <div className="flex-1 h-3 bg-slate-700 rounded-full overflow-hidden">
                              <div className={`h-full ${elementsData[el].color} opacity-80`} style={{ width: `${(result.data1.elementsCount[el] / result.data1.totalChars) * 100}%` }}></div>
                            </div>
                            <span className="text-xs text-slate-400 w-6">{result.data1.elementsCount[el]}개</span>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className="text-xs text-pink-500/70 w-10 text-right">상대</span>
                            <div className="flex-1 h-3 bg-slate-700 rounded-full overflow-hidden">
                              <div className={`h-full ${elementsData[el].color}`} style={{ width: `${(result.data2.elementsCount[el] / result.data2.totalChars) * 100}%` }}></div>
                            </div>
                            <span className="text-xs text-pink-400/80 w-6">{result.data2.elementsCount[el]}개</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                  <p className="text-xs text-slate-400 mt-6 text-center">* 위 그래프에서 서로 부족한 기운(짧은 막대)을 상대방이 채워줄수록(긴 막대) 오행 보완 궁합이 좋습니다.</p>
                </div>

              </div>
            )}
            
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
