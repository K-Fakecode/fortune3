<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사주 만세력 & 운세 풀이 - 단독 실행 수정본</title>
  <style>
    :root{
      --bg:#0f172a; --panel:#1e293b; --panel2:#334155; --line:#475569;
      --text:#f8fafc; --muted:#94a3b8; --amber:#fbbf24; --rose:#fb7185; --sky:#38bdf8;
      --green:#22c55e; --red:#ef4444; --yellow:#eab308; --blue:#3b82f6; --slate:#e2e8f0;
      --purple:#c084fc; --pink:#f472b6; --emerald:#34d399;
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top,#1e293b 0,#0f172a 50%,#020617 100%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.65}
    .wrap{max-width:1100px;margin:0 auto;padding:28px 16px 80px}
    .hero{text-align:center;margin-bottom:24px}
    .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.35);color:#fde68a;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
    h1{font-size:clamp(28px,5vw,46px);margin:14px 0 8px;color:var(--amber);letter-spacing:-.04em}
    h2{margin:0 0 14px;font-size:24px;color:var(--amber)}
    h3{margin:0 0 12px;font-size:20px;color:#fde68a}
    p{margin:0}.muted{color:var(--muted)}
    .grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
    @media(max-width:820px){.grid.two,.grid.three,.grid.four{grid-template-columns:1fr}.wrap{padding:20px 12px 60px}}
    .card{background:rgba(30,41,59,.88);border:1px solid rgba(148,163,184,.22);border-radius:22px;padding:22px;box-shadow:0 22px 60px rgba(0,0,0,.28);backdrop-filter:blur(8px)}
    .card.soft{background:rgba(15,23,42,.72)}
    .tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0}.tab,.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;color:var(--text);background:#334155;transition:.15s}.tab.active,.btn.primary{background:linear-gradient(135deg,#d97706,#f59e0b);color:#111827}.tab:hover,.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
    .btn{width:100%;font-size:16px;margin-top:10px}.btn.secondary{background:#475569}.btn.small{width:auto;margin:0;padding:8px 12px;font-size:13px;border-radius:10px}
    label{display:block;font-size:13px;color:#cbd5e1;font-weight:700;margin:0 0 6px}input,select{width:100%;background:#0f172a;color:#fff;border:1px solid #475569;border-radius:14px;padding:13px 14px;font-size:16px;outline:none}input:focus,select:focus{border-color:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.16)}
    .check{display:flex;align-items:center;gap:9px;margin-top:10px;color:#cbd5e1;font-size:14px}.check input{width:auto}.hidden{display:none!important}
    .notice{border-radius:16px;padding:14px 16px;margin:14px 0;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.35);color:#bae6fd}.error{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.45);color:#fecdd3}.ok{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.35);color:#a7f3d0}
    .pillar-wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media(max-width:720px){.pillar-wrap{grid-template-columns:repeat(2,minmax(0,1fr))}}
    .pillar{border:1px solid #475569;border-radius:18px;overflow:hidden;background:#0f172a;text-align:center}.pillar-title{background:#334155;color:#cbd5e1;font-size:13px;padding:8px;font-weight:800}.stem,.branch{padding:12px 8px}.stem{border-bottom:1px solid #334155}.ten{font-size:12px;color:#5eead4}.big{font-size:36px;font-weight:950;line-height:1.1}.el{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:900;margin-top:6px;color:#111827}.el.목{background:var(--green)}.el.화{background:var(--red);color:white}.el.토{background:var(--yellow)}.el.금{background:var(--slate)}.el.수{background:var(--blue);color:white}.hidden-stems{display:flex;gap:7px;justify-content:center;font-size:12px;font-weight:900;color:#c084fc;margin-top:8px}
    .bar-row{display:grid;grid-template-columns:55px 1fr 46px;gap:10px;align-items:center;margin:10px 0}.bar{height:14px;border-radius:999px;background:#0f172a;border:1px solid #334155;overflow:hidden}.bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#38bdf8,#fbbf24)}
    .chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid rgba(148,163,184,.28);background:rgba(15,23,42,.65);padding:6px 10px;border-radius:999px;font-size:13px;color:#e2e8f0}.chip.good{border-color:rgba(52,211,153,.45);color:#a7f3d0}.chip.warn{border-color:rgba(251,113,133,.45);color:#fecdd3}.chip.hot{border-color:rgba(251,191,36,.5);color:#fde68a}
    table{width:100%;border-collapse:collapse;overflow:hidden;border-radius:16px}th,td{border-bottom:1px solid rgba(148,163,184,.18);padding:10px;text-align:left;font-size:14px}th{background:#334155;color:#fde68a}tr:last-child td{border-bottom:0}.section{margin-top:18px}.fade{animation:fade .35s ease-out}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .footer{margin-top:22px;font-size:12px;color:#94a3b8;text-align:center}.pre{white-space:pre-wrap}.mode-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.source-label{font-size:12px;color:#cbd5e1;background:#0f172a;border:1px solid #475569;border-radius:999px;padding:6px 10px;display:inline-block}.loading{opacity:.75;pointer-events:none}.diag{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#cbd5e1;background:#020617;border-radius:12px;padding:10px;margin-top:10px;overflow:auto}
  </style>
</head>
<body>
  <noscript><div class="wrap"><div class="card error">이 앱은 자바스크립트가 켜져 있어야 작동합니다.</div></div></noscript>
  <div class="wrap">
    <div class="hero">
      <div class="badge">✨ 단독 실행 안정화 수정본</div>
      <h1>사주 만세력 & 종합 운세</h1>
      <p class="muted">React, Babel, Tailwind 없이도 화면이 뜨도록 다시 만든 버전입니다.</p>
      <div id="engineNotice" class="notice">화면 로딩 완료. 정밀 만세력 라이브러리는 계산 시 자동으로 확인합니다.</div>
    </div>

    <div class="tabs">
      <button class="tab active" id="singleTab" type="button">혼자 보기</button>
      <button class="tab" id="coupleTab" type="button">궁합 보기</button>
      <button class="tab" id="normalBtn" type="button">일반 풀이</button>
      <button class="tab" id="harshBtn" type="button">팩폭 풀이</button>
    </div>

    <div class="card">
      <form id="sajuForm">
        <div class="grid two">
          <div>
            <h3>👤 본인 정보</h3>
            <div class="grid two">
              <div><label>생년월일 8자리</label><input id="date1" inputmode="numeric" maxlength="8" placeholder="예: 19910412" value="19910412"></div>
              <div><label>태어난 시간 4자리</label><input id="time1" inputmode="numeric" maxlength="4" placeholder="예: 1130" value="1130"></div>
              <div><label>성별</label><select id="gender1"><option value="male">남자</option><option value="female">여자</option></select></div>
              <div><label>출생 기준</label><select id="calendar1"><option value="solar">양력</option><option value="lunar" disabled>음력은 다음 버전 예정</option></select></div>
            </div>
            <label class="check"><input type="checkbox" id="unknown1"> 태어난 시간 모름</label>
          </div>
          <div id="coupleBox" class="hidden">
            <h3>💕 상대방 정보</h3>
            <div class="grid two">
              <div><label>생년월일 8자리</label><input id="date2" inputmode="numeric" maxlength="8" placeholder="예: 19950620"></div>
              <div><label>태어난 시간 4자리</label><input id="time2" inputmode="numeric" maxlength="4" placeholder="예: 0900"></div>
              <div><label>성별</label><select id="gender2"><option value="female">여자</option><option value="male">남자</option></select></div>
              <div><label>출생 기준</label><select id="calendar2"><option value="solar">양력</option><option value="lunar" disabled>음력은 다음 버전 예정</option></select></div>
            </div>
            <label class="check"><input type="checkbox" id="unknown2"> 태어난 시간 모름</label>
          </div>
        </div>
        <div id="errorBox" class="notice error hidden"></div>
        <button id="submitBtn" class="btn primary" type="submit">사주 계산하기</button>
      </form>
    </div>

    <div id="resultArea" class="section"></div>

    <div class="footer">※ 이 앱은 학습/참고용입니다. 명리학은 학파별 해석 차이가 있어 결과를 절대적 판단으로 쓰면 안 됩니다.</div>
  </div>

<script>
(function(){
  'use strict';
  const STEMS = ['갑','을','병','정','무','기','경','신','임','계'];
  const STEM_H = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  const BRANCHES = ['자','축','인','묘','진','사','오','미','신','유','술','해'];
  const BRANCH_H = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const stemInfo = {갑:{el:'목',yy:'+'},을:{el:'목',yy:'-'},병:{el:'화',yy:'+'},정:{el:'화',yy:'-'},무:{el:'토',yy:'+'},기:{el:'토',yy:'-'},경:{el:'금',yy:'+'},신:{el:'금',yy:'-'},임:{el:'수',yy:'+'},계:{el:'수',yy:'-'}};
  const branchInfo = {자:{el:'수',yy:'-'},축:{el:'토',yy:'-'},인:{el:'목',yy:'+'},묘:{el:'목',yy:'-'},진:{el:'토',yy:'+'},사:{el:'화',yy:'+'},오:{el:'화',yy:'-'},미:{el:'토',yy:'-'},신:{el:'금',yy:'+'},유:{el:'금',yy:'-'},술:{el:'토',yy:'+'},해:{el:'수',yy:'+'}};
  const hiddenStems = {자:['임','계'],축:['계','신','기'],인:['무','병','갑'],묘:['갑','을'],진:['을','계','무'],사:['무','경','병'],오:['병','기','정'],미:['정','을','기'],신:['무','임','경'],유:['경','신'],술:['신','정','무'],해:['무','갑','임']};
  const generates = {목:'화',화:'토',토:'금',금:'수',수:'목'};
  const controls = {목:'토',토:'수',수:'화',화:'금',금:'목'};
  const elName = {목:'목(木)',화:'화(火)',토:'토(土)',금:'금(金)',수:'수(水)'};
  const h2kStem = {'甲':'갑','乙':'을','丙':'병','丁':'정','戊':'무','己':'기','庚':'경','辛':'신','壬':'임','癸':'계'};
  const h2kBranch = {'子':'자','丑':'축','寅':'인','卯':'묘','辰':'진','巳':'사','午':'오','未':'미','申':'신','酉':'유','戌':'술','亥':'해'};
  const branchClashes = [{p:['자','오'],n:'자오충'},{p:['축','미'],n:'축미충'},{p:['인','신'],n:'인신충'},{p:['묘','유'],n:'묘유충'},{p:['진','술'],n:'진술충'},{p:['사','해'],n:'사해충'}];
  const branch六合 = [{p:['자','축'],n:'자축합',r:'토'},{p:['인','해'],n:'인해합',r:'목'},{p:['묘','술'],n:'묘술합',r:'화'},{p:['진','유'],n:'진유합',r:'금'},{p:['사','신'],n:'사신합',r:'수'},{p:['오','미'],n:'오미합',r:'토'}];
  const threeHarmony = [{set:['신','자','진'],r:'수',n:'신자진 수국'},{set:['해','묘','미'],r:'목',n:'해묘미 목국'},{set:['인','오','술'],r:'화',n:'인오술 화국'},{set:['사','유','축'],r:'금',n:'사유축 금국'}];
  const termApprox = [{n:'소한',m:1,d:5},{n:'대한',m:1,d:20},{n:'입춘',m:2,d:4},{n:'우수',m:2,d:19},{n:'경칩',m:3,d:5},{n:'춘분',m:3,d:20},{n:'청명',m:4,d:4},{n:'곡우',m:4,d:20},{n:'입하',m:5,d:5},{n:'소만',m:5,d:21},{n:'망종',m:6,d:5},{n:'하지',m:6,d:21},{n:'소서',m:7,d:7},{n:'대서',m:7,d:22},{n:'입추',m:8,d:7},{n:'처서',m:8,d:23},{n:'백로',m:9,d:7},{n:'추분',m:9,d:23},{n:'한로',m:10,d:8},{n:'상강',m:10,d:23},{n:'입동',m:11,d:7},{n:'소설',m:11,d:22},{n:'대설',m:12,d:7},{n:'동지',m:12,d:22}];
  const state = {mode:'single', reading:'normal', lunarReady:false, lunarChecked:false};
  const $ = id => document.getElementById(id);
  const resultArea = $('resultArea'), errorBox = $('errorBox'), engineNotice = $('engineNotice');

  function cleanNum(v,max){ return (v||'').replace(/\D/g,'').slice(0,max); }
  ['date1','date2'].forEach(id=>$(id).addEventListener('input',e=>e.target.value=cleanNum(e.target.value,8)));
  ['time1','time2'].forEach(id=>$(id).addEventListener('input',e=>e.target.value=cleanNum(e.target.value,4)));
  $('unknown1').addEventListener('change',()=>{$('time1').disabled=$('unknown1').checked;if($('unknown1').checked)$('time1').value='';});
  $('unknown2').addEventListener('change',()=>{$('time2').disabled=$('unknown2').checked;if($('unknown2').checked)$('time2').value='';});

  function setMode(mode){ state.mode=mode; $('coupleBox').classList.toggle('hidden',mode!=='couple'); $('singleTab').classList.toggle('active',mode==='single'); $('coupleTab').classList.toggle('active',mode==='couple'); resultArea.innerHTML=''; }
  function setReading(mode){ state.reading=mode; $('normalBtn').classList.toggle('active',mode==='normal'); $('harshBtn').classList.toggle('active',mode==='harsh'); }
  $('singleTab').onclick=()=>setMode('single'); $('coupleTab').onclick=()=>setMode('couple'); $('normalBtn').onclick=()=>setReading('normal'); $('harshBtn').onclick=()=>setReading('harsh');

  function showError(msg){ errorBox.textContent=msg; errorBox.classList.remove('hidden'); }
  function clearError(){ errorBox.textContent=''; errorBox.classList.add('hidden'); }
  function pad(n){return String(n).padStart(2,'0');}
  function fmtStem(s){return `${s}(${STEM_H[STEMS.indexOf(s)]}/${stemInfo[s].el})`;}
  function fmtBranch(b){return `${b}(${BRANCH_H[BRANCHES.indexOf(b)]}/${branchInfo[b].el})`;}
  function pillarText(p){return p.stem+p.branch;}
  function getPillarIndex(stem,branch){ for(let i=0;i<60;i++) if(STEMS[i%10]===stem && BRANCHES[i%12]===branch) return i; return 0; }
  function getPillarByIndex(idx){ idx=((idx%60)+60)%60; return {stem:STEMS[idx%10], branch:BRANCHES[idx%12]}; }
  function pairHas(a,b,pair){return pair.includes(a)&&pair.includes(b);}
  function getResourceElement(el){ return Object.keys(generates).find(k=>generates[k]===el); }
  function getControlElement(el){ return Object.keys(controls).find(k=>controls[k]===el); }

  function validate(dateStr,timeStr,unknown,label){
    if(dateStr.length!==8) throw new Error(`${label} 생년월일을 8자리로 입력해줘냥. 예: 19910412`);
    const y=+dateStr.slice(0,4), m=+dateStr.slice(4,6), d=+dateStr.slice(6,8);
    const dt=new Date(y,m-1,d);
    if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) throw new Error(`${label} 생년월일이 실제 날짜가 아니다냥.`);
    let hh=12, mm=0;
    if(!unknown){
      if(timeStr.length!==4) throw new Error(`${label} 태어난 시간을 4자리로 입력해줘냥. 예: 1130`);
      hh=+timeStr.slice(0,2); mm=+timeStr.slice(2,4);
      if(hh>23 || mm>59) throw new Error(`${label} 시간이 올바르지 않다냥. 0000~2359 범위로 입력해줘냥.`);
    }
    return {y,m,d,hh,mm,date:new Date(y,m-1,d,hh,mm,0)};
  }

  function getSolarClass(){ return window.Solar || (window.Lunar && window.Lunar.Solar) || (window.lunar && window.lunar.Solar) || null; }
  function ensureLunarLoaded(){
    if(state.lunarChecked) return Promise.resolve(!!getSolarClass());
    state.lunarChecked=true;
    return new Promise(resolve=>{
      if(getSolarClass()) { state.lunarReady=true; resolve(true); return; }
      const s=document.createElement('script');
      let done=false;
      const finish=ok=>{ if(done) return; done=true; state.lunarReady=ok && !!getSolarClass(); resolve(state.lunarReady); };
      s.src='https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.min.js';
      s.async=true; s.onload=()=>finish(true); s.onerror=()=>finish(false);
      document.head.appendChild(s);
      setTimeout(()=>finish(false),1800);
    });
  }

  function fromLunarJS(dt){
    const Solar=getSolarClass(); if(!Solar) return null;
    let solar;
    if(typeof Solar.fromYmdHms==='function') solar=Solar.fromYmdHms(dt.getFullYear(),dt.getMonth()+1,dt.getDate(),dt.getHours(),dt.getMinutes(),0);
    else if(typeof Solar.fromDate==='function') solar=Solar.fromDate(dt);
    else return null;
    const b=solar.getLunar().getEightChar();
    const y=b.getYear(), m=b.getMonth(), d=b.getDay(), t=b.getTime();
    function conv(x){return {stem:h2kStem[x.charAt(0)]||'?', branch:h2kBranch[x.charAt(1)]||'?'};}
    return {year:conv(y), month:conv(m), day:conv(d), time:conv(t), engine:'정밀 lunar-javascript'};
  }

  function julianDay(date){
    let y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
    if(m<=2){y-=1;m+=12;}
    const A=Math.floor(y/100), B=2-A+Math.floor(A/4);
    return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524;
  }
  function approxYearPillar(dt){
    let y=dt.getFullYear();
    const lichun=new Date(y,1,4,12,0,0);
    if(dt<lichun) y-=1;
    return getPillarByIndex(y-1984);
  }
  function approxMonthBranch(dt){
    const y=dt.getFullYear();
    const terms=[['인',new Date(y,1,4,12)],['묘',new Date(y,2,5,12)],['진',new Date(y,3,4,12)],['사',new Date(y,4,5,12)],['오',new Date(y,5,5,12)],['미',new Date(y,6,7,12)],['신',new Date(y,7,7,12)],['유',new Date(y,8,7,12)],['술',new Date(y,9,8,12)],['해',new Date(y,10,7,12)],['자',new Date(y,11,7,12)],['축',new Date(y+1,0,5,12)]];
    let b='축';
    for(const [br,day] of terms){ if(dt>=day) b=br; }
    if(dt<new Date(y,1,4,12)) b='축';
    return b;
  }
  function approxMonthStem(yearStem, monthBranch){
    const startMap={갑:'병',기:'병',을:'무',경:'무',병:'경',신:'경',정:'임',임:'임',무:'갑',계:'갑'};
    const start=STEMS.indexOf(startMap[yearStem]);
    const branchOrder=['인','묘','진','사','오','미','신','유','술','해','자','축'];
    return STEMS[(start+branchOrder.indexOf(monthBranch))%10];
  }
  function approxDayPillar(dt){
    // 1984-02-02을 갑자일 기준으로 삼는 단독 실행용 근사식입니다.
    const base=new Date(1984,1,2);
    const diff=Math.floor((new Date(dt.getFullYear(),dt.getMonth(),dt.getDate())-base)/(86400000));
    return getPillarByIndex(diff);
  }
  function hourBranch(h){
    if(h===23 || h===0) return '자';

  function calcTenGods(pillars,unknown){

  function renderLove(rows){return `<table><thead><tr><th>연도</th><th>세운</th><th>점수</th><th>이유</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.year}</td><td><b>${pillarText(r.pillar)}</b></td><td>${r.score}</td><td>${r.reasons.join(', ')||'잔잔함'}</td></tr>`).join('')}</tbody></table>`;}
  function renderSingle(data,title='본인'){const a=data.analysis, p=data.pillars, read=readingText(data); const keys=data.form.unknown?['year','month','day']:['year','month','day','time']; const labels={year:'년주',month:'월주',day:'일주',time:'시주'}; return `<div class="fade"><div class="card section"><div class="mode-row"><h2 style="margin-right:auto">📌 ${title} 사주 결과</h2><span class="source-label">계산 방식: ${data.engine}</span></div><div class="pillar-wrap">${keys.map(k=>renderPillar(labels[k],p[k])).join('')}</div>${data.engine.includes('근사')?'<div class="notice error">현재 정밀 만세력 CDN을 불러오지 못해 단독 실행용 근사 계산으로 표시했습니다. 화면은 정상 작동하지만, 실제 만세력과 일부 간지가 다를 수 있습니다.</div>':'<div class="notice ok">정밀 lunar-javascript 기준으로 계산했습니다.</div>'}</div><div class="grid two section"><div class="card"><h3>🌈 오행 분포</h3>${renderBars(a.counts)}</div><div class="card"><h3>🧭 십성 분포</h3><div class="chips">${renderTen(a.tens)}</div><div class="notice">신강/신약: <b>${a.strength.result}</b>(${a.strength.grade}) / ${a.strength.score}점<br>용신 후보: <b>${a.yong.y}</b>, 희신 후보: <b>${a.yong.h}</b></div></div></div><div class="card section"><h3>🧠 종합 해석</h3><p class="pre">${read.general}</p></div><div class="grid two section"><div class="card"><h3>💰 금전운</h3><p class="pre">${read.wealth}</p></div><div class="card"><h3>💖 연애운</h3><p class="pre">${read.love}</p></div></div><div class="card section"><h3>🌊 합충형 흐름</h3><div class="chips">${a.relations.length?a.relations.map(x=>`<span class="chip ${x.type==='충'?'warn':'good'}">${x.name}: ${x.desc}</span>`).join(''):'<span class="chip">큰 합충 신호는 약한 편</span>'}</div></div><div class="card section"><h3>🔮 신살 참고</h3><div class="chips">${a.shinsal.length?a.shinsal.map(x=>`<span class="chip ${x.c==='warn'?'warn':'good'}">${x.n}: ${state.reading==='harsh'?x.w:x.d}</span>`).join(''):'<span class="chip">주요 신살이 과하게 몰리진 않음</span>'}</div></div><div class="card section"><h3>🩺 건강 및 체질 참고</h3><p class="pre">${read.health}</p></div><div class="card section"><h3>🔟 대운 흐름</h3><p class="muted">${a.daewoon.label} 대운, ${a.daewoon.term} 기준 약 ${a.daewoon.startAge}세 전후 시작으로 계산했습니다.</p>${renderDaewoon(a.daewoon)}</div><div class="card section"><h3>💕 앞으로 인연이 들어오기 쉬운 해</h3>${renderLove(a.love)}</div><div class="card section"><h3>🌅 오늘의 일진</h3><p><b>${a.today.date} / ${pillarText(a.today.pillar)}</b></p><p>${a.today.msg}</p></div><details class="card section"><summary>진단 정보 보기</summary><div class="diag">engine=${data.engine}\nbirth=${data.form.birth.toString()}\nunknownTime=${data.form.unknown}</div></details></div>`;}
  function coupleScore(a,b){let score=60; const reasons=[]; if(a.analysis.dayEl===getResourceElement(b.analysis.dayEl)||b.analysis.dayEl===getResourceElement(a.analysis.dayEl)){score+=12;reasons.push('서로 보완하는 생조 관계');} if(a.analysis.dayEl===b.analysis.dayEl){score+=6;reasons.push('기질이 비슷함');} const hap=branch六合.find(x=>pairHas(a.pillars.day.branch,b.pillars.day.branch,x.p)); if(hap){score+=13;reasons.push('일지 '+hap.n);} const ch=branchClashes.find(x=>pairHas(a.pillars.day.branch,b.pillars.day.branch,x.p)); if(ch){score-=10;reasons.push('일지 '+ch.n+'로 충돌 가능');} const score2=Math.max(0,Math.min(100,score)); return {score:score2,reasons};}
  function renderCouple(d1,d2){const c=coupleScore(d1,d2); return `<div class="fade">${renderSingle(d1,'본인')}${renderSingle(d2,'상대방')}<div class="card section" style="text-align:center"><h2>💕 궁합 결과</h2><div style="font-size:72px;font-weight:950;color:var(--pink);line-height:1">${c.score}점</div><p class="muted">${c.reasons.join(' / ')||'큰 충돌 신호는 약하고 무난한 흐름입니다.'}</p><div class="notice">궁합은 점수보다 서로의 약점 패턴을 알고 조절하는 용도로 보는 게 제일 좋다냥.</div></div></div>`;}

  $('sajuForm').addEventListener('submit',async e=>{
    e.preventDefault(); clearError(); resultArea.innerHTML='<div class="card notice">계산 중이다냥. 화면이 멈춘 게 아니라 정밀 라이브러리 확인 중이다냥.</div>'; $('submitBtn').classList.add('loading');
    try{
      const f1=parseForm('1'); const d1=await getData(f1);
      engineNotice.className='notice '+(d1.engine.includes('근사')?'error':'ok');
      engineNotice.textContent=d1.engine.includes('근사')?'화면은 정상 작동 중입니다. 다만 정밀 CDN을 못 불러와 근사 계산을 사용했습니다.':'정밀 만세력 라이브러리 로딩 성공. 정확 계산 기준으로 표시합니다.';
      if(state.mode==='couple'){
        const f2=parseForm('2'); const d2=await getData(f2); resultArea.innerHTML=renderCouple(d1,d2);
      } else resultArea.innerHTML=renderSingle(d1,'본인');
    }catch(err){showError(err.message||String(err)); resultArea.innerHTML='';}
    finally{$('submitBtn').classList.remove('loading');}
  });
})();
</script>
</body>
</html>
